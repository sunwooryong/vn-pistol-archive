<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>베트남 사격기록 아카이브</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1216">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=78">
</head>
<body>
  <!-- 로그인 게이트 (로그인 전까지 표시) -->
  <div id="auth-gate"></div>

  <!-- 앱 (로그인 후 표시) -->
  <div id="app-root" hidden>
    <header>
      <div class="hwrap">
        <div class="htop">
          <h1>사격기록 아카이브</h1>
          <div class="hbtns">
            <button id="info-btn" aria-label="데이터 정보">ⓘ <span id="info-date"></span></button>
            <button id="logout-btn" aria-label="로그아웃">로그아웃</button>
          </div>
        </div>
        <p class="tag">사격 · 베트남 사격연맹</p>
      </div>
      <div id="info-pop" hidden></div>
    </header>

    <nav class="tabs">
      <button class="tab on" data-tab="home">홈</button>
      <button class="tab" data-tab="me" hidden>내 정보</button>
      <button class="tab" data-tab="athlete">선수</button>
      <button class="tab" data-tab="comp">대회별</button>
      <button class="tab" data-tab="cal">달력</button>
      <button class="tab" data-tab="medals">입상실적</button>
      <button class="tab" data-tab="rank">랭킹</button>
      <button class="tab" data-tab="fav" hidden>★</button>
      <button class="tab" data-tab="admin" hidden>관리</button>
    </nav>

    <main>
      <section id="view-home" class="view"></section>
      <section id="view-me" class="view" hidden></section>

      <section id="view-athlete" class="view">
        <div class="searchbar">
          <input id="ath-q" type="search" placeholder="선수명 검색 (예: Phạm Quang Huy)" autocomplete="off">
        </div>
        <div id="ath-count" class="count"></div>
        <div id="ath-list" class="ath-list"></div>
        <div id="ath-detail" class="ath-detail"></div>
      </section>

      <section id="view-comp" class="view" hidden>
        <div class="filters">
          <select id="comp-year"></select>
          <select id="comp-scope"></select>
        </div>
        <div id="comp-count" class="count"></div>
        <div id="comp-list" class="comp-list"></div>
      </section>

      <section id="view-cal" class="view" hidden></section>

      <section id="view-medals" class="view" hidden>
        <div class="filters">
          <select id="med-year"></select>
          <select id="med-disc"></select>
          <select id="med-scope"></select>
        </div>
        <div id="med-count" class="count"></div>
        <div id="med-out"></div>
      </section>

      <section id="view-fav" class="view" hidden></section>

      <section id="view-rank" class="view" hidden>
        <div class="filters">
          <select id="rk-disc"></select>
          <select id="rk-gender"></select>
          <select id="rk-age"></select>
        </div>
        <div id="rk-count" class="count"></div>
        <div id="rk-out"></div>
      </section>

      <section id="view-admin" class="view" hidden></section>
    </main>

    <div id="modal" hidden>
      <div class="modal-card">
        <button id="modal-close" aria-label="닫기">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- 실시간 선수 대시보드 배너 (작은 상단 알약 · 리포트보다 아래 레이어) -->
  <a href="dashboard/" id="dash-banner" aria-label="실시간 선수 대시보드 열기"
     style="position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:6px;
     padding:4px 11px 4px 9px;border-radius:999px;text-decoration:none;color:#fff;
     background:linear-gradient(135deg,#0a63a8,#0092d6);
     box-shadow:0 4px 12px rgba(3,52,92,.35);border:1px solid rgba(255,255,255,.35);
     font-family:'Malgun Gothic','Segoe UI',system-ui,sans-serif">
    <span style="font-size:13px;line-height:1">🏅</span>
    <b style="font-size:11.5px;font-weight:800;letter-spacing:.2px">실시간 대시보드</b>
    <span style="font-size:12px;line-height:1;opacity:.9">→</span>
  </a>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="i18n.js?v=78"></script>
  <script src="config.js?v=78"></script>
  <script src="data.js?v=78"></script>
  <script src="analytics.js?v=78"></script>
  <script src="favorites.js?v=78"></script>
  <script src="app.js?v=78"></script>
  <script src="auth.js?v=78"></script>
</body>
</html>
