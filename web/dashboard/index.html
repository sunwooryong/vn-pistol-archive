  .wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}

  .brand{display:flex;align-items:center;gap:10px;min-width:0}

  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(255,255,255,.9)}

  .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;
    padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.32)}
  .seg{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:rgba(255,255,255,.88);padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;color:#0a63a8;font-weight:800}

  /* mode tabs */
  .modes{display:flex;gap:10px;max-width:1120px;margin:0 auto;padding:14px 16px 0;flex-wrap:wrap}
  .mode{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--shadow)}

  .muted{color:var(--mut)}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:12px}

  /* KPI */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

  .kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
  .kpi .v.good{color:var(--good)} .kpi .v.warn{color:var(--warn)} .kpi .v.gold{color:var(--gold)} .kpi .v.acc{color:var(--acc)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;transition:.15s;box-shadow:var(--shadow)}

  .chip .g{font-size:11px;color:var(--mut);margin-left:4px}
  .chip.on .g{color:#dbeeff}

  /* bars */
  .bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .track{background:#e6edf6;border-radius:8px;height:18px;overflow:hidden;border:1px solid var(--line)}
  .bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#00a1e0,#0081C8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .bar .fill.gold{background:linear-gradient(90deg,#f0b93a,#d99a1f)}
  .bar .fill.good{background:linear-gradient(90deg,#2bb972,#1f9d57)}
  .bar .fill.warn{background:linear-gradient(90deg,#f26a6a,#e23b3b)}
  .bar b{text-align:right;color:var(--tx)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--mut);font-weight:700;font-size:12px}
  td.l,th.l{text-align:left}
  tbody tr:hover td{background:#f2f7fc}
  tr.male-h td,tr.female-h td{background:linear-gradient(90deg,#0a63a8,#0092d6);color:#fff;font-weight:800;text-align:left;font-size:12px;letter-spacing:.4px}
  tr.male-h:hover td,tr.female-h:hover td{background:linear-gradient(90deg,#0a63a8,#0092d6)}
  thead th{background:#eaf1f9;color:#3a5573}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
  .tag.A{background:#e2f6ea;color:#178a4c}.tag.B{background:#e4eefb;color:#2166a8}
  .tag.C{background:#fdf3d9;color:#a5781a}.tag.D{background:#fdeaea;color:#c0392b}
  .tag.risk{background:#fdeaea;color:#c0392b}.tag.ok{background:#e2f6ea;color:#178a4c}

  .meet-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#0092d6,#0a63a8);

  .big-stat{font-size:40px;font-weight:800;letter-spacing:.5px}
  .goal{background:var(--goldbg);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:8px 0}
  .goal.warn{background:var(--warnbg);border-left-color:var(--warn)}

  .rp h3{font-size:18px;color:var(--acc2);margin:22px 0 4px}
  .rp .banner{border-radius:10px;padding:11px 14px;margin:8px 0 12px;font-weight:700;font-size:13.5px}
  .rp .banner.gold{background:var(--goldbg);border:1px solid #ecd7a2;color:#8a6712}
  .rp .banner.warn{background:var(--warnbg);border:1px solid #f2bfbf;color:#b02a2a}
  .rp .sub{font-size:13px;color:var(--acc2);font-weight:800;border-bottom:2px solid var(--accsoft);padding-bottom:4px;margin:14px 0 6px}
  .rp p{font-size:13.5px;color:#34495e;margin:6px 0}
  .rp .verdict{background:var(--goldbg);border:1px solid #ecd7a2;border-radius:10px;padding:12px 14px;color:#4a3d18}
  .sparkwrap{display:flex;align-items:center;gap:10px}
  .loading{text-align:center;color:var(--mut);padding:60px 0}
  .err{background:var(--warnbg);border:1px solid #f2bfbf;color:#c0392b;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
  /* yearly medal detail */
  .yearcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(180deg,#f7fafe,#eef4fb)}
  .yh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
  .yy{font-size:19px;color:var(--acc2);font-weight:800;letter-spacing:.3px}
  .mb{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--tx);font-weight:600}
  .mb.fin{color:var(--mut);background:transparent;border:0;padding:3px 2px}
  .mlist{display:grid;gap:6px}
  .ml{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0}
  .ml .em{font-size:15px}
  .mt{font-size:10.5px;font-weight:800;background:var(--accsoft);color:var(--acc2);border-radius:5px;padding:1px 6px}
  .mt.tm{background:#fff2df;color:#a5781a}
  .md-d{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px;min-width:42px}
  .md-e{font-weight:800;color:var(--tx)}
  .md-c{font-size:12px}
  .ynone{color:var(--mut);font-size:12px}
  .hide{display:none!important}
  @media print{header,.modes,.chips,.btn,.seg{display:none!important} body{background:#fff;color:#000}}
</style>
</head>

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else{ if(c==='"')q=true; else if(c===','){row.push(f);f=""}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f=""}
      else if(c==='\r'){} else f+=c } }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
const num=x=>{const v=parseFloat(String(x).replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v};
function monthKey(d){ const m=String(d).match(/(\d{4})[.\-]\s*(\d{1,2})/); return m?`${m[1]}-${String(+m[2]).padStart(2,"0")}`:null; }

async function getWith(u,kind,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{const r=await fetch(u,{cache:"no-store"});
      if(r.ok)return kind==="json"?r.json():r.text();
      last=new Error(r.status);
    }catch(e){last=e;}
    await sleep(500*(i+1)); // backoff for Google rate-limit (transient 400/429)
  }
  throw last;
}
const fetchText=u=>getWith(u,"text");
const fetchJSON=u=>getWith(u,"json");

function computePractice(rows){
  const H=3; const out={}; NAMES.forEach(n=>out[n]={n:0,persh:[],best60:0,mon:{},ser:{1:[],2:[],3:[],4:[],5:[],6:[]}});
  for(let i=H+1;i<rows.length;i++){const r=rows[i];if(!r||r.length<8)continue;
    const name=(r[1]||"").trim(); if(!out[name])continue;
    const ev=(r[4]||""); if(!ev.includes("10m"))continue;
    const shots=num(r[6]), total=num(r[7]); if(!shots||!total)continue;
    const ps=total/shots; out[name].n++; out[name].persh.push(ps);
    if(shots===60&&total>out[name].best60)out[name].best60=total;
    if(shots===60){for(let sn=1;sn<=6;sn++){const v=num(r[7+sn]);if(v!=null&&v>50&&v<=109)out[name].ser[sn].push(v);}}
    const mk=monthKey(r[0]); if(mk){(out[name].mon[mk]=out[name].mon[mk]||[]).push(ps);}
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  for(const n in out){const o=out[n]; o.avg=avg(o.persh);
    o.trend=Object.keys(o.mon).sort().map(m=>({m,v:avg(o.mon[m])}));
    o.tser=[1,2,3,4,5,6].map(sn=>avg(o.ser[sn]));}
  return out;
}
function idx(h,sub){return h.findIndex(x=>x&&x.includes(sub));}
function computePred(rows){
  const h=rows[0]; const iName=idx(h,"선수명"),iMatch=idx(h,"누적완전일치율"),iPa=idx(h,"전체_예측점수평균"),iRa=idx(h,"전체_실제점수평균"),iV=idx(h,"최종판정");
  const out={};
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<=iName)continue;const nm=(r[iName]||"").trim();if(!byName[nm])continue;
    out[nm]={match:num(r[iMatch]),pa:num(r[iPa]),ra:num(r[iRa]),verdict:r[iV]||""};}
  return out;
}
function computeInterview(rows){
  const h=rows[0]; const iName=idx(h,"Athlete"),iRisk=idx(h,"Risk Score"),iLvl=idx(h,"Risk Level"),iType=idx(h,"Primary Type"),
    iRep=idx(h,"Repeated Problem"),iAct=idx(h,"One Action"),iSolve=idx(h,"Problem to Solve");
  const out={};
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<=iName)continue;const nm=(r[iName]||"").trim();if(!byName[nm])continue;
    out[nm]={risk:num(r[iRisk]),level:r[iLvl]||"",type:r[iType]||"",prob:r[iRep]||"",act:r[iAct]||"",solve:r[iSolve]||""};}
  return out;
}
function computeArchive(ath,res,ev,seriesRows,comps){
  const evm={}; ev.forEach(e=>evm[e.id]=e);
  const cm={}; (comps||[]).forEach(c=>cm[c.id]=c);
  const id2=Object.fromEntries(ath.filter(a=>byName[a.full_name]).map(a=>[a.id,a.full_name]));
  const out={}; NAMES.forEach(n=>out[n]={ind:[0,0,0],team:[0,0,0],best60:0,finals:0,count:0,recent:[],
    cser:{1:[],2:[],3:[],4:[],5:[],6:[]},cshot:[],results:[],yearly:{},q10all:[],inner10:[]});
  const M={gold:0,silver:1,bronze:2};
  const byres={}; (seriesRows||[]).forEach(s=>{(byres[s.result_id]=byres[s.result_id]||{})[s.series_no]=s.score;});
  res.forEach(r=>{const nm=id2[r.athlete_id];if(!nm)return;const o=out[nm];o.count++;
    const e=evm[r.event_id]||{}; const c=cm[e.competition_id]||{};
    const year=String(c.year||(r.match_date||'').slice(0,4)||'?');
    if(r.medal!=null&&M[r.medal]!=null)o.ind[M[r.medal]]++;
    if(r.team_medal!=null&&M[r.team_medal]!=null)o.team[M[r.team_medal]]++;
    if(r.final_score)o.finals++;
    if(r.qual_total&&r.qual_total>500&&r.qual_total>o.best60)o.best60=r.qual_total;
    const is10ind=(e.distance==="10m"&&e.team_type==="individual"&&e.n_series===6);
    if(is10ind){const ss=byres[r.id]; if(ss&&Object.keys(ss).length>=6){for(let sn=1;sn<=6;sn++)if(ss[sn]!=null)o.cser[sn].push(ss[sn]);}
      if(r.qual_total){o.cshot.push(r.qual_total/60);o.q10all.push({d:r.match_date,q:r.qual_total,medal:r.medal,final:r.final_score,plc:r.placement});if(r.inner_tens!=null)o.inner10.push(r.inner_tens);}}
    o.results.push({d:r.match_date,comp:c.name||'',year,dist:e.distance,team:e.team_type,age:e.age_category,scope:c.scope,
      q:r.qual_total,inner:r.inner_tens,final:r.final_score,medal:r.medal,tmedal:r.team_medal,qr:r.qual_rank,fr:r.final_rank,plc:r.placement});
    const y=(o.yearly[year]=o.yearly[year]||{comps:new Set(),ind:[0,0,0],team:[0,0,0],finals:0,q10:[],inner:[]});
    if(e.competition_id)y.comps.add(e.competition_id);
    if(r.medal!=null&&M[r.medal]!=null)y.ind[M[r.medal]]++;
    if(r.team_medal!=null&&M[r.team_medal]!=null)y.team[M[r.team_medal]]++;
    if(r.final_score)y.finals++;
    if(is10ind&&r.qual_total){y.q10.push(r.qual_total);if(r.inner_tens!=null)y.inner.push(r.inner_tens);}
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const std=a=>{if(a.length<2)return null;const m=avg(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length);};
  NAMES.forEach(n=>{const o=out[n];
    o.cserAvg=[1,2,3,4,5,6].map(sn=>avg(o.cser[sn]));o.cshotAvg=avg(o.cshot);o.ncomp=o.cshot.length;
    o.q10sd=std(o.q10all.map(x=>x.q));o.innerAvg=avg(o.inner10);
    o.results.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
    o.q10all.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
    o.recent=o.results.filter(r=>(r.d||'')>='2026'&&r.team==='individual').slice(-3).map(r=>({d:r.d,q:r.q,f:r.final,medal:r.medal,team:r.tmedal,plc:r.plc}));
    o.yearsArr=Object.keys(o.yearly).filter(y=>y!=='?').sort().map(y=>{const yy=o.yearly[y];
      return {year:y,n:yy.comps.size,ind:yy.ind,team:yy.team,finals:yy.finals,
        q10avg:avg(yy.q10),q10max:yy.q10.length?Math.max(...yy.q10):null,innerAvg:avg(yy.inner)};});
    o.finalsList=o.results.filter(r=>r.final!=null).map(r=>({d:r.d,dist:r.dist,age:r.age,final:r.final,fr:r.fr,plc:r.plc,medal:r.medal}));
  });
  return out;
}

function sparkline(trend,w=180,h=44){

  const area=`8,${h-6} ${pts} ${(w-8)},${h-6}`;

function seriesBars(train,comp){
  const w=Math.min(560,window.innerWidth-70),h=210;const pad={l:32,r:10,t:14,b:26};
  const vals=[...train,...comp].filter(v=>v!=null);if(vals.length<2)return `<span class="muted">${t("noData")}</span>`;
  const mn=Math.floor(Math.min(...vals))-1,mx=Math.ceil(Math.max(...vals))+1;
  const bw=(w-pad.l-pad.r)/6,barw=Math.min(15,bw*0.30);
  const py=v=>h-pad.b-((v-mn)/(mx-mn))*(h-pad.t-pad.b);
  let grid="";for(let g=mn;g<=mx;g+=2){const y=py(g);grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#dbe4f1"/><text x="${pad.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#7688a0">${g}</text>`;}
  let bars="";
  for(let i=0;i<6;i++){const cx=pad.l+bw*i+bw/2,tv=train[i],cv=comp[i];
    if(tv!=null){const y=py(tv);bars+=`<rect x="${(cx-barw-2).toFixed(1)}" y="${y.toFixed(1)}" width="${barw.toFixed(1)}" height="${(h-pad.b-y).toFixed(1)}" rx="2.5" fill="url(#gbBlue)"/><text x="${(cx-barw/2-2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#2a7fc0">${tv.toFixed(1)}</text>`;}
    if(cv!=null){const y=py(cv);bars+=`<rect x="${(cx+2).toFixed(1)}" y="${y.toFixed(1)}" width="${barw.toFixed(1)}" height="${(h-pad.b-y).toFixed(1)}" rx="2.5" fill="url(#gbGold)"/><text x="${(cx+barw/2+2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#d99a1f">${cv.toFixed(1)}</text>`;}
    bars+=`<text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#7688a0">S${i+1}</text>`;}
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%"><defs>
    <linearGradient id="gbBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a7fc0"/><stop offset="1" stop-color="#3f7fe6"/></linearGradient>
    <linearGradient id="gbGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2dc96"/><stop offset="1" stop-color="#c69b3e"/></linearGradient></defs>${grid}${bars}</svg>`;
}
// stacked medal bar chart per year (individual G/S/B solid + team faded)
function medalBars(years){
  if(!years||!years.length)return `<span class="muted">${t("noData")}</span>`;
  const w=Math.min(560,window.innerWidth-70),h=210;const pad={l:26,r:10,t:14,b:34};
  const totals=years.map(y=>totalMedals(y.ind)+totalMedals(y.team));
  const mx=Math.max(3,...totals);const n=years.length,bw=(w-pad.l-pad.r)/n,barw=Math.min(50,bw*0.52);
  const py=v=>h-pad.b-(v/mx)*(h-pad.t-pad.b);
  let grid="";const step=Math.max(1,Math.ceil(mx/4));
  for(let g=0;g<=mx;g+=step){const y=py(g);grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#dbe4f1"/><text x="${pad.l-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#7688a0">${g}</text>`;}
  const cols=[['#d99a1f',0],['#9aa7b5',1],['#c07a3c',2]];
  let bars="";
  years.forEach((y,i)=>{const cx=pad.l+bw*i+bw/2;let base=0,svg="";
    const stack=[[y.ind[0],'#d99a1f'],[y.ind[1],'#9aa7b5'],[y.ind[2],'#c07a3c'],
      [y.team[0],'#f0d9a0'],[y.team[1],'#ccd4de'],[y.team[2],'#e2b591']];
    stack.forEach(([c,col])=>{c=c||0;if(c){const y0=py(base+c),hgt=py(base)-py(base+c);
      svg+=`<rect x="${(cx-barw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${barw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${col}"/>`;base+=c;}});
    const tot=totalMedals(y.ind)+totalMedals(y.team);
    bars+=svg+`${tot?`<text x="${cx.toFixed(1)}" y="${(py(base)-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#d99a1f">${tot}</text>`:''}
      <text x="${cx.toFixed(1)}" y="${h-18}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#122a45">${y.year}</text>
      <text x="${cx.toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="8.5" fill="#7688a0">${t("ry_finals")} ${y.finals||0}</text>`;});
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">${grid}${bars}</svg>`;
}
function medalDot(m){return m==='gold'?'#d99a1f':m==='silver'?'#9aa7b5':m==='bronze'?'#c07a3c':'#0081C8';}
// Detailed textual medal breakdown per year (replaces vertical bar chart)
function medalDetail(a){
  const ar=DATA.archive[a.name]||{};const wrap=el("div");
  const EM={gold:'🥇',silver:'🥈',bronze:'🥉'};const RK={gold:0,silver:1,bronze:2};
  const CN=LANG==='ko'?'개인':'CN', TM=LANG==='ko'?'단체':'ĐĐ';
  const yearsDesc=(ar.yearsArr||[]).slice().reverse();
  if(!yearsDesc.length){wrap.append(el("p","muted",t("noData")));return wrap;}
  const byYear={}; (ar.results||[]).forEach(r=>{if(r.medal||r.tmedal)(byYear[r.year]=byYear[r.year]||[]).push(r);});
  const badge=(arr,lbl)=>{const p=[];if(arr[0])p.push('🥇'+arr[0]);if(arr[1])p.push('🥈'+arr[1]);if(arr[2])p.push('🥉'+arr[2]);
    return p.length?`<span class="mb">${lbl} ${p.join(' ')}</span>`:'';};
  yearsDesc.forEach(y=>{
    const card=el("div","yearcard");
    const head=`<div class="yh"><span class="yy">${y.year}</span>${badge(y.ind,CN)}${badge(y.team,TM)}<span class="mb fin">${t("ry_finals")} ${y.finals||0}</span></div>`;
    const lines=[];
    (byYear[y.year]||[]).forEach(r=>{
      if(r.medal)lines.push({m:r.medal,team:false,d:r.d,dist:r.dist,age:r.age,comp:r.comp});
      if(r.tmedal)lines.push({m:r.tmedal,team:true,d:r.d,dist:r.dist,age:r.age,comp:r.comp});});
    lines.sort((x,z)=>(RK[x.m]-RK[z.m])||(x.d||'').localeCompare(z.d||''));
    let rows="";
    lines.forEach(l=>{const ev=`${l.dist||''}${l.age?' '+l.age:''}`.trim();const dt=(l.d||'').slice(5);
      rows+=`<div class="ml"><span class="em">${EM[l.m]}</span><span class="mt ${l.team?'tm':''}">${l.team?TM:CN}</span><span class="md-d">${dt}</span><span class="md-e">${esc(ev)}</span><span class="md-c muted">${esc(l.comp||'')}</span></div>`;});
    card.innerHTML=head+`<div class="mlist">${rows||`<div class="ynone">${LANG==='ko'?'획득 메달 없음':'Không có huy chương'}</div>`}</div>`;
    wrap.append(card);
  });
  return wrap;
}
function qualTimeline(pts,w,h){
  w=w||Math.min(560,window.innerWidth-70);h=h||156;
  const pad={l:34,r:12,t:12,b:24};
  const ys=pts.map(p=>p.q).filter(v=>v!=null); if(ys.length<2)return `<span class="muted">${t("noData")}</span>`;
  const mn=Math.min(...ys)-3,mx=Math.max(...ys)+3;
  const px=i=>pad.l+(pts.length<2?0:i/(pts.length-1))*(w-pad.l-pad.r);
  const py=v=>h-pad.b-((v-mn)/(mx-mn))*(h-pad.t-pad.b);
  let grid="";for(let g=Math.ceil(mn/10)*10;g<=mx;g+=10){const y=py(g);grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#dbe4f1"/><text x="${pad.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#7688a0">${g}</text>`;}
  const lp=pts.map((p,i)=>p.q!=null?`${px(i).toFixed(1)},${py(p.q).toFixed(1)}`:null).filter(Boolean).join(" ");
  const dots=pts.map((p,i)=>p.q==null?"":`${p.final!=null?`<circle cx="${px(i).toFixed(1)}" cy="${py(p.q).toFixed(1)}" r="7" fill="none" stroke="${medalDot(p.medal)}" stroke-width="1.4" opacity=".55"/>`:''}<circle cx="${px(i).toFixed(1)}" cy="${py(p.q).toFixed(1)}" r="${p.medal?4.6:3.2}" fill="${medalDot(p.medal)}" stroke="${p.medal?'#ffffff':'none'}" stroke-width="1"/>`).join("");
  const lab=i=>{const d=pts[i]&&pts[i].d?pts[i].d.slice(0,7):'';return `<text x="${px(i).toFixed(1)}" y="${h-7}" text-anchor="middle" font-size="9" fill="#7688a0">${d}</text>`;};
  let xl=lab(0)+lab(pts.length-1)+(pts.length>4?lab(Math.floor(pts.length/2)):'');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">${grid}<polyline points="${lp}" fill="none" stroke="#0081C8" stroke-width="2"/>${dots}${xl}</svg>`;
}
function recordAnalysis(a){

  const conv=entries?(ar.finals/entries*100):0;
  const tmedals=totalMedals(ar.ind)+totalMedals(ar.team);
  const mconv=entries?(tmedals/entries*100):0;
  const kp=el("div","grid kpis");
  kp.append(kpiEl(ar.best60||'—',t("mx_best"),"acc"),
    kpiEl((ar.finals||0)+" · "+conv.toFixed(0)+"%",t("mx_conv"),"good"),
    kpiEl(tmedals+" · "+mconv.toFixed(0)+"%",t("mx_medal"),"gold"),
    kpiEl(ar.q10sd!=null?ar.q10sd.toFixed(1):'—',t("mx_consistency"),(ar.q10sd!=null&&ar.q10sd<6)?'good':''),
    kpiEl(ar.innerAvg!=null?ar.innerAvg.toFixed(1):'—',t("mx_inner")));

  tb.append(bd);c1.append(tb);wrap.append(c1);

    <div class="muted" style="font-size:11.5px;text-align:center;margin-top:4px">
    <span style="color:#d99a1f">●</span> ${t("lgGold")} &nbsp;<span style="color:#9aa7b5">●</span> ${t("lgSilver")} &nbsp;<span style="color:#c07a3c">●</span> ${t("lgBronze")} &nbsp;<span style="color:#0081C8">●</span> ${t("lgOther")} &nbsp;◯ ${t("lgFinal")}</div>`;
  wrap.append(c2);
  // finals list
  wrap.append(el("h2","sec",t("rec_finals")));
  const fl=ar.finalsList||[];
  if(fl.length){const c3=el("div","card");c3.style.overflowX="auto";const tb3=el("table");
    tb3.innerHTML=`<thead><tr><th>${t("colDate")}</th><th class="l">${t("colEvent")}</th><th>${t("colFinal")}</th><th>${t("colFrank")}</th></tr></thead>`;
    const bd3=el("tbody");
    fl.slice().reverse().forEach(f=>{const tr=el("tr");const md=f.medal?` <span style="color:${medalDot(f.medal)}">●</span>`:'';
      tr.innerHTML=`<td>${f.d||'—'}</td><td class="l">${(f.dist||'')} ${(f.age||'')}</td><td><b>${f.final}</b>${md}</td><td>${f.fr||f.plc||'—'}</td>`;bd3.append(tr);});
    tb3.append(bd3);c3.append(tb3);wrap.append(c3);}

function reportBlock(a){

  sec(t("hComp"),a.report.comp[LANG]);
  sec(t("hPred"),pr.match!=null?(a.report.pred[LANG]+` <span class="muted">(${t("prog")}: ${pr.match.toFixed(1)}%, ${esc(pr.verdict)})</span>`):a.report.pred[LANG]);
  wrap.append(el("div","sub",t("hInt")));

  else wrap.append(el("p","muted",t("noData")));

  app.append(pbtn);
  const O=ordered();
  const block=(a)=>{const p=DATA.practice[a.name]||{},pr=DATA.pred[a.name]||{},ar=DATA.archive[a.name]||{},iv=DATA.interview[a.name]||{};
    const wrap=el("div","card");wrap.id="rp-"+a.key;wrap.style.marginBottom="14px";
    wrap.append(el("h3",null,`${a.name} <span class="muted" style="font-size:14px">${a.kr} · ${a.birth} · ${a.club}</span>`));
    const ban=el("div","banner "+(a.warn?"warn":"gold"));ban.innerHTML=(a.warn?"⚠ ":"★ ")+a.headline[LANG];wrap.append(ban);
    // quick stats line
    const line=el("p");line.innerHTML=`<span class="muted">${t("best")}:</span> <b>${ar.best60||'—'}</b> &nbsp;
      <span class="muted">${t("avg")}:</span> <b>${p.avg?p.avg.toFixed(2):'—'}</b> &nbsp;
      <span class="muted">${t("medals")}:</span> ${medalStr(ar.ind)} <span class="muted">(개인)</span> / ${medalStr(ar.team)} <span class="muted">(단체)</span>`;
    wrap.append(line);
    const sec=(h,txt)=>{wrap.append(el("div","sub",h));wrap.append(el("p",null,txt));};
    sec(t("hComp"),a.report.comp[LANG]);
    // practice with sparkline
    wrap.append(el("div","sub",t("hPrac")));
    const pw=el("div","sparkwrap");pw.innerHTML=`${sparkline(p.trend,200,44)}<p style="margin:0">${LANG==="ko"?`한 발당 평균 <b>${p.avg?p.avg.toFixed(2):'—'}</b>, 세션 ${p.n||0}회, 60발 최고 ${p.best60||'—'}`:`TB/phát <b>${p.avg?p.avg.toFixed(2):'—'}</b>, ${p.n||0} buổi, 60 viên cao nhất ${p.best60||'—'}`}</p>`;
    wrap.append(pw);
    sec(t("hPred"),pr.match!=null?(a.report.pred[LANG]+` <span class="muted">(${t("prog")}: ${pr.match.toFixed(1)}%, ${esc(pr.verdict)})</span>`):a.report.pred[LANG]);
    // interview mini table
    wrap.append(el("div","sub",t("hInt")));
    if(iv.risk!=null){const it=el("p");it.innerHTML=`<b style="color:${iv.risk>=26?'var(--warn)':'inherit'}">${t("risk")} ${iv.risk} (${esc(iv.level)})</b> · ${t("type")}: ${esc(iv.type)}<br>
      <span class="muted">${t("prob")}:</span> ${esc(iv.prob)}<br><span class="muted">${t("act")}:</span> ${esc(iv.act)}`;wrap.append(it);}
    else wrap.append(el("p","muted",t("noData")));
    // tests
    wrap.append(el("div","sub",t("hTest")));
    if(a.tests){const tp=el("p");tp.innerHTML=`<b>${t("prog")}:</b> ${a.tests.join(" → ")} <span class="tag ${a.testGrade[0]}">${a.testGrade}</span><br>${a.report.tests[LANG]}`;wrap.append(tp);}
    else wrap.append(el("p",null,a.report.tests[LANG]));
    // verdict
    wrap.append(el("div","sub",t("hVerdict")));
    const v=el("div","verdict");v.innerHTML=a.report.verdict[LANG];wrap.append(v);
    return wrap;};
  app.append(el("h2","sec",t("male")));O.m.forEach(a=>app.append(block(a)));
  app.append(el("h2","sec",t("female")));O.f.forEach(a=>app.append(block(a)));
  return app;
}

// ================= MODE: TRAINING vs COMPETITION =================
function seriesChart(train,comp,w,h){
  w=w||Math.min(560,window.innerWidth-70); h=h||190;
  const pad={l:34,r:12,t:14,b:26};
  const all=[...train,...comp].filter(v=>v!=null);
  if(all.length<2)return `<span class="muted">${t("noData")}</span>`;
  const mn=Math.floor(Math.min(...all))-1, mx=Math.ceil(Math.max(...all))+1;
  const px=i=>pad.l+(i/5)*(w-pad.l-pad.r);
  const py=v=>h-pad.b-((v-mn)/(mx-mn))*(h-pad.t-pad.b);
  const line=(arr,col)=>{const pts=arr.map((v,i)=>v==null?null:`${px(i).toFixed(1)},${py(v).toFixed(1)}`).filter(Boolean).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`
      + arr.map((v,i)=>v==null?"":`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.4" fill="${col}"/>`).join("");}
  // gap shading between train and comp
  let gapPoly="";
  const both=train.map((v,i)=>({t:v,c:comp[i],i})).filter(o=>o.t!=null&&o.c!=null);
  if(both.length>1){const top=both.map(o=>`${px(o.i).toFixed(1)},${py(o.t).toFixed(1)}`).join(" ");
    const bot=both.slice().reverse().map(o=>`${px(o.i).toFixed(1)},${py(o.c).toFixed(1)}`).join(" ");
    gapPoly=`<polygon points="${top} ${bot}" fill="rgba(226,183,60,.10)"/>`;}
  // gridlines/labels
  let grid="";
  for(let g=mn;g<=mx;g+=2){const y=py(g);grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#dbe4f1" stroke-width="1"/>
    <text x="${pad.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#7688a0">${g}</text>`;}
  let xl="";for(let i=0;i<6;i++)xl+=`<text x="${px(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#7688a0">S${i+1}</text>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">
    ${grid}${gapPoly}${line(comp,'#d99a1f')}${line(train,'#0081C8')}${xl}</svg>`;
}
function renderCompare(){
  const app=el("div"); const O=ordered();
  // A) at-a-glance overview
  app.append(el("h2","sec",t("vs_head")));
  app.append(el("p","muted",t("vs_desc")));
  const rows=O.all.map(a=>{const p=DATA.practice[a.name]||{},ar=DATA.archive[a.name]||{};
    return {a,tr:p.avg,ma:ar.cshotAvg,n:ar.ncomp||0};}).filter(x=>x.tr!=null&&x.ma!=null);
  rows.sort((x,y)=>(y.tr-y.ma)-(x.tr-x.ma)); // biggest drop first
  const card=el("div","card");card.style.overflowX="auto";
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th class="l">${t("c_name")}</th><th>${t("c_train")}</th><th>${t("c_match")}</th><th>${t("c_gap")}</th><th>${t("vs_ncomp")}</th></tr></thead>`;
  const body=el("tbody");
  const maxGap=Math.max(...rows.map(r=>r.tr-r.ma),0.01);
  rows.forEach(({a,tr,ma,n})=>{const gap=tr-ma;const pct=(gap/maxGap*100).toFixed(0);
    const trr=el("tr");
    trr.innerHTML=`<td class="l"><b>${a.name.split(" ").slice(-1)}</b> <span class="muted">${a.kr}</span></td>
     <td style="color:var(--acc)">${tr.toFixed(2)}</td><td style="color:var(--gold)">${ma.toFixed(2)}</td>
     <td><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:60px;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;display:inline-block"><span style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#b23,#ff5d5d)"></span></span><b style="color:var(--warn)">−${gap.toFixed(2)}</b></span></td>
     <td>${n}</td>`;
    trr.style.cursor="pointer";trr.onclick=()=>{VS_SEL=a.key;render();window.scrollTo({top:document.querySelector('#vsdetail')?.offsetTop-70||0,behavior:'smooth'});};
    body.append(trr);});
  tb.append(body);card.append(tb);app.append(card);

  // B) per-athlete series detail
  app.append(el("h2","sec",t("vs_series")));
  if(!VS_SEL)VS_SEL=O.all[0].key;
  const chips=el("div","chips");
  O.all.forEach(a=>{const c=el("div","chip"+(a.key===VS_SEL?" on":""));
    c.innerHTML=`${a.name.split(" ").slice(-1)} <span class="g">${a.kr}</span>`;
    c.onclick=()=>{VS_SEL=a.key;render();};chips.append(c);});
  app.append(chips);
  const a=ATH.find(x=>x.key===VS_SEL);
  const p=DATA.practice[a.name]||{},ar=DATA.archive[a.name]||{};
  const train=p.tser||[null,null,null,null,null,null], comp=ar.cserAvg||[null,null,null,null,null,null];
  const d=el("div","card");d.id="vsdetail";
  d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <b>${a.name.split(" ").slice(-1)} ${a.kr}</b>
    <div style="font-size:12px"><span style="color:var(--acc)">■</span> ${t("vs_train")} &nbsp; <span style="color:var(--gold)">■</span> ${t("vs_match")}</div></div>
    <div style="text-align:center;margin:6px 0">${seriesBars(train,comp)}</div>`;
  // per-series numeric + gap
  const g=el("div");g.style.marginTop="6px";
  const line=el("div","bar");line.style.gridTemplateColumns="70px repeat(6,1fr)";
  const hd=`<span class="l muted"></span>`+[1,2,3,4,5,6].map(s=>`<b style="text-align:center;color:var(--mut)">S${s}</b>`).join("");
  const tline=`<span class="l" style="color:var(--acc)">${t("vs_train")}</span>`+train.map(v=>`<b style="text-align:center">${v!=null?v.toFixed(1):'—'}</b>`).join("");
  const mline=`<span class="l" style="color:var(--gold)">${t("vs_match")}</span>`+comp.map(v=>`<b style="text-align:center">${v!=null?v.toFixed(1):'—'}</b>`).join("");
  const gline=`<span class="l" style="color:var(--warn)">Δ</span>`+train.map((v,i)=>{const c=comp[i];const gap=(v!=null&&c!=null)?(v-c):null;
    return `<b style="text-align:center;color:${gap>0.6?'var(--warn)':gap!=null?'#c9b16a':'var(--mut)'}">${gap!=null?'−'+gap.toFixed(1):'—'}</b>`;}).join("");
  g.innerHTML=`<div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${hd}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${tline}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${mline}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${gline}</div>`;
  d.append(g);
  // insight
  const valid=train.map((v,i)=>({s:i+1,t:v,c:comp[i],gap:(v!=null&&comp[i]!=null)?v-comp[i]:null})).filter(o=>o.gap!=null);
  if(valid.length){const worstComp=valid.slice().sort((x,y)=>x.c-y.c)[0];
    const maxDrop=valid.slice().sort((x,y)=>y.gap-x.gap)[0];
    const ins=el("div","goal");
    const ovGap=(p.avg!=null&&ar.cshotAvg!=null)?(p.avg-ar.cshotAvg):null;
    ins.innerHTML=`<b>${t("vs_insight")}</b><br>`+
      (LANG==="ko"
        ? `전체 한발당 격차 <b style="color:var(--warn)">−${ovGap!=null?ovGap.toFixed(2):'—'}</b> (훈련 ${p.avg?p.avg.toFixed(2):'—'} → 대회 ${ar.cshotAvg?ar.cshotAvg.toFixed(2):'—'}). `
          +`${t("vs_worst")}: <b>S${worstComp.s}</b> (대회 ${worstComp.c.toFixed(1)}), ${t("vs_drop")}: <b>S${maxDrop.s}</b> (Δ−${maxDrop.gap.toFixed(1)}).`
        : `Chênh TB/phát <b style="color:var(--warn)">−${ovGap!=null?ovGap.toFixed(2):'—'}</b> (tập ${p.avg?p.avg.toFixed(2):'—'} → thi ${ar.cshotAvg?ar.cshotAvg.toFixed(2):'—'}). `
          +`${t("vs_worst")}: <b>S${worstComp.s}</b> (thi ${worstComp.c.toFixed(1)}), ${t("vs_drop")}: <b>S${maxDrop.s}</b> (Δ−${maxDrop.gap.toFixed(1)}).`);
    d.append(ins);}
  app.append(d);
  app.append(el("p","muted",t("vs_note")+" · "+t("vs_ncomp")+" "+(ar.ncomp||0)));
  return app;
}

// ================= app shell =================
function render(){
  const app=document.getElementById("app");app.innerHTML="";
  if(DATA.err){app.innerHTML=`<div class="err">데이터 로드 실패: ${esc(DATA.err)}<br>새로고침을 눌러 다시 시도하세요.</div>`;return;}
  if(!DATA.loaded){app.innerHTML=`<div class="loading">${t("loading")}</div>`;return;}
  if(MODE==="solo")app.append(renderSolo());
  else app.append(renderTeam());
}
function applyLangStatic(){document.querySelectorAll("[data-t]").forEach(e=>{const k=e.getAttribute("data-t");if(I18N[LANG][k])e.textContent=I18N[LANG][k];});
  document.documentElement.lang=LANG;}
function setMode(){document.querySelectorAll(".mode").forEach(m=>m.classList.toggle("on",m.dataset.mode===MODE));render();}

document.getElementById("lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  LANG=b.dataset.lang;document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x.dataset.lang===LANG));
  applyLangStatic();render();
  document.getElementById("updated").textContent=t("updatedAt")+" "+new Date().toLocaleTimeString(LANG==="ko"?"ko-KR":"vi-VN");});
document.getElementById("modes").addEventListener("click",e=>{const m=e.target.closest(".mode");if(!m)return;MODE=m.dataset.mode;location.hash=MODE;setMode();});
document.getElementById("refresh").addEventListener("click",async()=>{
  const b=document.getElementById("refresh");b.textContent="…";
  try{await loadAll();DATA.loaded=true;DATA.err=null;}catch(e){DATA.err=String(e);}
  b.textContent=t("refresh");render();});

async function boot(){
  applyLangStatic();
  if(location.hash&&["team","solo"].includes(location.hash.slice(1))){MODE=location.hash.slice(1);setMode();}
  try{await loadAll();DATA.loaded=true;}catch(e){DATA.err=String(e);}
  render();
  // auto-refresh every 90s (real-time)
  setInterval(async()=>{try{await loadAll();DATA.loaded=true;DATA.err=null;render();}catch(e){}},90000);
}
boot();
