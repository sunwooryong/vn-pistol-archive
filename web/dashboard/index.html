<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>베트남 청소년 권총 대표팀 · 실시간 대시보드</title>
<style>
  :root{

  body{background:linear-gradient(180deg,#0b0f18,#0e131f 30%);color:var(--tx);

  a{color:var(--acc);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}

  .brand{display:flex;align-items:center;gap:12px;min-width:0}

  .brand .flags{height:26px;border-radius:4px}
  .brand .tt{display:flex;flex-direction:column;min-width:0}
  .brand .tt b{font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .brand .tt span{font-size:11px;color:var(--mut);white-space:nowrap}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(55,201,138,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,201,138,.5)}70%{box-shadow:0 0 0 8px rgba(55,201,138,0)}100%{box-shadow:0 0 0 0 rgba(55,201,138,0)}}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;
    padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--acc);color:#fff}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--mut);padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--acc);color:#fff;font-weight:700}

  /* mode tabs */
  .modes{display:flex;gap:8px;max-width:1120px;margin:0 auto;padding:12px 16px 0;flex-wrap:wrap}
  .mode{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .mode:hover{border-color:var(--acc2);transform:translateY(-1px)}
  .mode.on{border-color:var(--acc);background:linear-gradient(135deg,#20304f,#182136);box-shadow:var(--shadow)}
  .mode .ic{font-size:20px}
  .mode b{display:block;font-size:14.5px;margin-top:4px}
  .mode small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
  .mode.on b{color:#fff}

  h2.sec{font-size:16px;color:var(--acc);margin:26px 0 12px;letter-spacing:.3px}
  .muted{color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:12px}

  /* KPI */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:.3px}
  .kpi .l{font-size:12px;color:var(--mut);margin-top:2px}
  .kpi .v.good{color:var(--good)} .kpi .v.warn{color:var(--warn)} .kpi .v.gold{color:var(--gold)} .kpi .v.acc{color:var(--acc)}

  /* athlete chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;transition:.15s}
  .chip:hover{border-color:var(--acc2)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .chip .g{font-size:11px;color:var(--mut);margin-left:4px}
  .chip.on .g{color:#dde}

  /* bars */
  .bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .track{background:var(--bg2);border-radius:8px;height:16px;overflow:hidden;border:1px solid var(--line)}
  .bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
  .bar .fill.gold{background:linear-gradient(90deg,#a8842a,var(--gold))}
  .bar .fill.good{background:linear-gradient(90deg,#25936a,var(--good))}
  .bar .fill.warn{background:linear-gradient(90deg,#b23,var(--warn))}
  .bar b{text-align:right}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--mut);font-weight:600;font-size:12px;position:sticky}
  td.l,th.l{text-align:left}
  tr.male-h td,tr.female-h td{background:var(--acc2);color:#fff;font-weight:700;text-align:left;font-size:12px}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .tag.A{background:#173d2c;color:#54e0a0}.tag.B{background:#2a3350;color:#9db8ff}
  .tag.C{background:#3a3320;color:#e2c24c}.tag.D{background:#3a1f28;color:#ff8a8a}
  .tag.risk{background:var(--warnbg);color:#ff9a9a}.tag.ok{background:#173d2c;color:#54e0a0}

  /* meeting mode */
  .meet-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .avatar{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2b3a58,#1a2233);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;border:2px solid var(--acc);color:#fff}
  .big-stat{font-size:40px;font-weight:800;letter-spacing:.5px}
  .goal{background:var(--goldbg);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:8px 0}
  .goal.warn{background:var(--warnbg);border-left-color:var(--warn)}
  .goal b{color:var(--gold)} .goal.warn b{color:var(--warn)}
  .pledge{background:linear-gradient(135deg,#1a2f4a,#16233a);border:1px solid var(--acc2);border-radius:12px;padding:14px 16px;margin-top:10px}
  .pledge .q{font-size:15px;line-height:1.6}

  /* report mode */
  .rp h3{font-size:18px;color:#fff;margin:22px 0 4px}
  .rp .banner{border-radius:10px;padding:11px 14px;margin:8px 0 12px;font-weight:700;font-size:13.5px}
  .rp .banner.gold{background:var(--goldbg);border:1px solid #5a4d20;color:#f0d78a}
  .rp .banner.warn{background:var(--warnbg);border:1px solid #6a2a2a;color:#ffb0b0}
  .rp .sub{font-size:13px;color:var(--acc);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px;margin:14px 0 6px}
  .rp p{font-size:13.5px;color:#d5deee;margin:6px 0}
  .rp .verdict{background:var(--goldbg);border:1px solid #5a4d20;border-radius:10px;padding:12px 14px}
  .sparkwrap{display:flex;align-items:center;gap:10px}
  .loading{text-align:center;color:var(--mut);padding:60px 0}
  .err{background:var(--warnbg);border:1px solid #6a2a2a;color:#ffb0b0;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
  .hide{display:none!important}
  @media print{header,.modes,.chips,.btn,.seg{display:none!important} body{background:#fff;color:#000}}
</style>
</head>

// ================= CSV parser =================
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else{ if(c==='"')q=true; else if(c===','){row.push(f);f=""}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f=""}
      else if(c==='\r'){} else f+=c } }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
const num=x=>{const v=parseFloat(String(x).replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v};
function monthKey(d){ const m=String(d).match(/(\d{4})[.\-]\s*(\d{1,2})/); return m?`${m[1]}-${String(+m[2]).padStart(2,"0")}`:null; }

let DATA={pred:{},practice:{},interview:{},archive:{}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getWith(u,kind,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{const r=await fetch(u,{cache:"no-store"});
      if(r.ok)return kind==="json"?r.json():r.text();
      last=new Error(r.status);
    }catch(e){last=e;}
    await sleep(500*(i+1)); // backoff for Google rate-limit (transient 400/429)
  }
  throw last;
}
const fetchText=u=>getWith(u,"text");
const fetchJSON=u=>getWith(u,"json");

function computePractice(rows){
  const H=3; const out={}; NAMES.forEach(n=>out[n]={n:0,persh:[],best60:0,mon:{},ser:{1:[],2:[],3:[],4:[],5:[],6:[]}});
  for(let i=H+1;i<rows.length;i++){const r=rows[i];if(!r||r.length<8)continue;
    const name=(r[1]||"").trim(); if(!out[name])continue;
    const ev=(r[4]||""); if(!ev.includes("10m"))continue;
    const shots=num(r[6]), total=num(r[7]); if(!shots||!total)continue;
    const ps=total/shots; out[name].n++; out[name].persh.push(ps);
    if(shots===60&&total>out[name].best60)out[name].best60=total;
    if(shots===60){for(let sn=1;sn<=6;sn++){const v=num(r[7+sn]);if(v!=null&&v>50&&v<=109)out[name].ser[sn].push(v);}}
    const mk=monthKey(r[0]); if(mk){(out[name].mon[mk]=out[name].mon[mk]||[]).push(ps);}
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  for(const n in out){const o=out[n]; o.avg=avg(o.persh);
    o.trend=Object.keys(o.mon).sort().map(m=>({m,v:avg(o.mon[m])}));
    o.tser=[1,2,3,4,5,6].map(sn=>avg(o.ser[sn]));}
  return out;
}
function idx(h,sub){return h.findIndex(x=>x&&x.includes(sub));}
function computePred(rows){
  const h=rows[0]; const iName=idx(h,"선수명"),iMatch=idx(h,"누적완전일치율"),iPa=idx(h,"전체_예측점수평균"),iRa=idx(h,"전체_실제점수평균"),iV=idx(h,"최종판정");
  const out={};
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<=iName)continue;const nm=(r[iName]||"").trim();if(!byName[nm])continue;
    out[nm]={match:num(r[iMatch]),pa:num(r[iPa]),ra:num(r[iRa]),verdict:r[iV]||""};}
  return out;
}
function computeInterview(rows){
  const h=rows[0]; const iName=idx(h,"Athlete"),iRisk=idx(h,"Risk Score"),iLvl=idx(h,"Risk Level"),iType=idx(h,"Primary Type"),
    iRep=idx(h,"Repeated Problem"),iAct=idx(h,"One Action"),iSolve=idx(h,"Problem to Solve");
  const out={};
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<=iName)continue;const nm=(r[iName]||"").trim();if(!byName[nm])continue;
    out[nm]={risk:num(r[iRisk]),level:r[iLvl]||"",type:r[iType]||"",prob:r[iRep]||"",act:r[iAct]||"",solve:r[iSolve]||""};}
  return out;
}
function computeArchive(ath,res,ev,seriesRows){
  const evm={}; ev.forEach(e=>evm[e.id]=e);
  const id2=Object.fromEntries(ath.filter(a=>byName[a.full_name]).map(a=>[a.id,a.full_name]));
  const out={}; NAMES.forEach(n=>out[n]={ind:[0,0,0],team:[0,0,0],best60:0,finals:0,count:0,recent:[],
    cser:{1:[],2:[],3:[],4:[],5:[],6:[]},cshot:[]});
  const M={gold:0,silver:1,bronze:2};
  // series indexed by result_id
  const byres={}; (seriesRows||[]).forEach(s=>{(byres[s.result_id]=byres[s.result_id]||{})[s.series_no]=s.score;});
  res.forEach(r=>{const nm=id2[r.athlete_id];if(!nm)return;const o=out[nm];o.count++;
    if(r.medal!=null&&M[r.medal]!=null)o.ind[M[r.medal]]++;
    if(r.team_medal!=null&&M[r.team_medal]!=null)o.team[M[r.team_medal]]++;
    if(r.final_score)o.finals++;
    if(r.qual_total&&r.qual_total>500&&r.qual_total>o.best60)o.best60=r.qual_total;
    // competition per-series (10m individual 60-shot)
    const e=evm[r.event_id]||{};
    if(e.distance==="10m"&&e.team_type==="individual"&&e.n_series===6){
      const ss=byres[r.id]; if(ss&&Object.keys(ss).length>=6){for(let sn=1;sn<=6;sn++)if(ss[sn]!=null)o.cser[sn].push(ss[sn]);}
      if(r.qual_total)o.cshot.push(r.qual_total/60);
    }
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  NAMES.forEach(n=>{const o=out[n];o.cserAvg=[1,2,3,4,5,6].map(sn=>avg(o.cser[sn]));o.cshotAvg=avg(o.cshot);o.ncomp=o.cshot.length;});
  // recent 2026 (top 3 by date) per athlete
  const perA={}; NAMES.forEach(n=>perA[n]=[]);
  res.forEach(r=>{const nm=id2[r.athlete_id];if(!nm)return;const d=r.match_date||"";if(d<"2026")return;
    perA[nm].push(r);});
  for(const nm in perA){perA[nm].sort((a,b)=>(a.match_date||"").localeCompare(b.match_date||""));
    out[nm].recent=perA[nm].slice(-3).map(r=>({d:r.match_date,q:r.qual_total,f:r.final_score,
      medal:r.medal,team:r.team_medal,plc:r.placement}));}
  return out;
}

async function loadAll(){
  // sequential + small stagger to avoid Google Sheets rate-limit (transient 400)
  DATA.practice=computePractice(parseCSV(await fetchText(csvUrl(SHEETS.practice)))); await sleep(150);
  DATA.pred=computePred(parseCSV(await fetchText(csvUrl(SHEETS.pred)))); await sleep(150);
  DATA.interview=computeInterview(parseCSV(await fetchText(csvUrl(SHEETS.interview))));
  try{
    const [ath,res,ev,ser]=await Promise.all([fetchJSON(ARCHIVE+"athletes.json"),fetchJSON(ARCHIVE+"results.json"),fetchJSON(ARCHIVE+"events.json"),fetchJSON(ARCHIVE+"series.json")]);
    DATA.archive=computeArchive(ath,res,ev,ser);
  }catch(e){ DATA.archive={}; DATA.archiveErr=String(e); }
  const now=new Date();
  document.getElementById("updated").textContent=t("updatedAt")+" "+now.toLocaleTimeString(LANG==="ko"?"ko-KR":"vi-VN");
}

const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function medalStr(a){return `<span style="color:var(--gold)">${a[0]}</span>·<span style="color:#cfd6e6">${a[1]}</span>·<span style="color:#c9905a">${a[2]}</span>`;}
function totalMedals(a){const ar=a||[0,0,0];return ar[0]+ar[1]+ar[2];}
function sparkline(trend,w=180,h=44){
  if(!trend||trend.length<2)return `<span class="muted">${t("noData")}</span>`;
  const xs=trend.map((_,i)=>i),ys=trend.map(p=>p.v);
  const mn=Math.min(...ys)-0.05,mx=Math.max(...ys)+0.05;
  const px=i=>8+ (i/(trend.length-1))*(w-16);
  const py=v=>h-6-((v-mn)/(mx-mn))*(h-12);
  const pts=trend.map((p,i)=>`${px(i).toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");
  const last=trend[trend.length-1].v, first=trend[0].v, up=last>=first;
  const area=`8,${h-6} ${pts} ${(w-8)},${h-6}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="${up?'rgba(55,201,138,.12)':'rgba(255,93,93,.12)'}"/>
    <polyline points="${pts}" fill="none" stroke="${up?'#37c98a':'#ff5d5d'}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${px(trend.length-1)}" cy="${py(last)}" r="3.2" fill="${up?'#37c98a':'#ff5d5d'}"/>
  </svg>`;
}

function seriesChart(train,comp,w,h){
  w=w||Math.min(560,window.innerWidth-70); h=h||190;
  const pad={l:34,r:12,t:14,b:26};
  const all=[...train,...comp].filter(v=>v!=null);
  if(all.length<2)return `<span class="muted">${t("noData")}</span>`;
  const mn=Math.floor(Math.min(...all))-1, mx=Math.ceil(Math.max(...all))+1;
  const px=i=>pad.l+(i/5)*(w-pad.l-pad.r);
  const py=v=>h-pad.b-((v-mn)/(mx-mn))*(h-pad.t-pad.b);
  const line=(arr,col)=>{const pts=arr.map((v,i)=>v==null?null:`${px(i).toFixed(1)},${py(v).toFixed(1)}`).filter(Boolean).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`
      + arr.map((v,i)=>v==null?"":`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.4" fill="${col}"/>`).join("");}
  // gap shading between train and comp
  let gapPoly="";
  const both=train.map((v,i)=>({t:v,c:comp[i],i})).filter(o=>o.t!=null&&o.c!=null);
  if(both.length>1){const top=both.map(o=>`${px(o.i).toFixed(1)},${py(o.t).toFixed(1)}`).join(" ");
    const bot=both.slice().reverse().map(o=>`${px(o.i).toFixed(1)},${py(o.c).toFixed(1)}`).join(" ");
    gapPoly=`<polygon points="${top} ${bot}" fill="rgba(226,183,60,.10)"/>`;}
  // gridlines/labels
  let grid="";
  for(let g=mn;g<=mx;g+=2){const y=py(g);grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#2c384f" stroke-width="1"/>
    <text x="${pad.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#93a1bd">${g}</text>`;}
  let xl="";for(let i=0;i<6;i++)xl+=`<text x="${px(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#93a1bd">S${i+1}</text>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">
    ${grid}${gapPoly}${line(comp,'#e2b73c')}${line(train,'#5b9dff')}${xl}</svg>`;
}

  const a=ATH.find(x=>x.key===VS_SEL);
  const p=DATA.practice[a.name]||{},ar=DATA.archive[a.name]||{};
  const train=p.tser||[null,null,null,null,null,null], comp=ar.cserAvg||[null,null,null,null,null,null];
  const d=el("div","card");d.id="vsdetail";
  d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <b>${a.name.split(" ").slice(-1)} ${a.kr}</b>
    <div style="font-size:12px"><span style="color:var(--acc)">■</span> ${t("vs_train")} &nbsp; <span style="color:var(--gold)">■</span> ${t("vs_match")}</div></div>
    <div style="text-align:center;margin:6px 0">${seriesChart(train,comp)}</div>`;
  // per-series numeric + gap
  const g=el("div");g.style.marginTop="6px";
  const line=el("div","bar");line.style.gridTemplateColumns="70px repeat(6,1fr)";
  const hd=`<span class="l muted"></span>`+[1,2,3,4,5,6].map(s=>`<b style="text-align:center;color:var(--mut)">S${s}</b>`).join("");
  const tline=`<span class="l" style="color:var(--acc)">${t("vs_train")}</span>`+train.map(v=>`<b style="text-align:center">${v!=null?v.toFixed(1):'—'}</b>`).join("");
  const mline=`<span class="l" style="color:var(--gold)">${t("vs_match")}</span>`+comp.map(v=>`<b style="text-align:center">${v!=null?v.toFixed(1):'—'}</b>`).join("");
  const gline=`<span class="l" style="color:var(--warn)">Δ</span>`+train.map((v,i)=>{const c=comp[i];const gap=(v!=null&&c!=null)?(v-c):null;
    return `<b style="text-align:center;color:${gap>0.6?'var(--warn)':gap!=null?'#c9b16a':'var(--mut)'}">${gap!=null?'−'+gap.toFixed(1):'—'}</b>`;}).join("");
  g.innerHTML=`<div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${hd}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${tline}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${mline}</div>
    <div class="bar" style="grid-template-columns:70px repeat(6,1fr)">${gline}</div>`;
  d.append(g);
  // insight
  const valid=train.map((v,i)=>({s:i+1,t:v,c:comp[i],gap:(v!=null&&comp[i]!=null)?v-comp[i]:null})).filter(o=>o.gap!=null);
  if(valid.length){const worstComp=valid.slice().sort((x,y)=>x.c-y.c)[0];
    const maxDrop=valid.slice().sort((x,y)=>y.gap-x.gap)[0];
    const ins=el("div","goal");
    const ovGap=(p.avg!=null&&ar.cshotAvg!=null)?(p.avg-ar.cshotAvg):null;
    ins.innerHTML=`<b>${t("vs_insight")}</b><br>`+
      (LANG==="ko"
        ? `전체 한발당 격차 <b style="color:var(--warn)">−${ovGap!=null?ovGap.toFixed(2):'—'}</b> (훈련 ${p.avg?p.avg.toFixed(2):'—'} → 대회 ${ar.cshotAvg?ar.cshotAvg.toFixed(2):'—'}). `
          +`${t("vs_worst")}: <b>S${worstComp.s}</b> (대회 ${worstComp.c.toFixed(1)}), ${t("vs_drop")}: <b>S${maxDrop.s}</b> (Δ−${maxDrop.gap.toFixed(1)}).`
        : `Chênh TB/phát <b style="color:var(--warn)">−${ovGap!=null?ovGap.toFixed(2):'—'}</b> (tập ${p.avg?p.avg.toFixed(2):'—'} → thi ${ar.cshotAvg?ar.cshotAvg.toFixed(2):'—'}). `
          +`${t("vs_worst")}: <b>S${worstComp.s}</b> (thi ${worstComp.c.toFixed(1)}), ${t("vs_drop")}: <b>S${maxDrop.s}</b> (Δ−${maxDrop.gap.toFixed(1)}).`);
    d.append(ins);}
  app.append(d);
  app.append(el("p","muted",t("vs_note")+" · "+t("vs_ncomp")+" "+(ar.ncomp||0)));
  return app;
}

// ================= app shell =================
function render(){
  const app=document.getElementById("app");app.innerHTML="";
  if(DATA.err){app.innerHTML=`<div class="err">데이터 로드 실패: ${esc(DATA.err)}<br>새로고침을 눌러 다시 시도하세요.</div>`;return;}
  if(!DATA.loaded){app.innerHTML=`<div class="loading">${t("loading")}</div>`;return;}
  if(MODE==="coach")app.append(renderCoach());
  else if(MODE==="report")app.append(renderReport());
  else if(MODE==="vs")app.append(renderCompare());
  else app.append(renderMeet());
}
function applyLangStatic(){document.querySelectorAll("[data-t]").forEach(e=>{const k=e.getAttribute("data-t");if(I18N[LANG][k])e.textContent=I18N[LANG][k];});
  document.documentElement.lang=LANG;}
function setMode(){document.querySelectorAll(".mode").forEach(m=>m.classList.toggle("on",m.dataset.mode===MODE));render();}

document.getElementById("lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  LANG=b.dataset.lang;document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x.dataset.lang===LANG));
  applyLangStatic();render();
  document.getElementById("updated").textContent=t("updatedAt")+" "+new Date().toLocaleTimeString(LANG==="ko"?"ko-KR":"vi-VN");});
document.getElementById("modes").addEventListener("click",e=>{const m=e.target.closest(".mode");if(!m)return;MODE=m.dataset.mode;location.hash=MODE;setMode();});
document.getElementById("refresh").addEventListener("click",async()=>{
  const b=document.getElementById("refresh");b.textContent="…";
  try{await loadAll();DATA.loaded=true;DATA.err=null;}catch(e){DATA.err=String(e);}
  b.textContent=t("refresh");render();});

async function boot(){
  applyLangStatic();
  if(location.hash&&["meet","coach","report","vs"].includes(location.hash.slice(1))){MODE=location.hash.slice(1);setMode();}
  try{await loadAll();DATA.loaded=true;}catch(e){DATA.err=String(e);}
  render();
  // auto-refresh every 90s (real-time)
  setInterval(async()=>{try{await loadAll();DATA.loaded=true;DATA.err=null;render();}catch(e){}},90000);
}
boot();
</script>
</body>
</html>
