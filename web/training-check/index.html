<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://ipwho.is">
<title>Training Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7eef8; --bg2:#f4f8fd; --panel:#ffffff; --line:#dbe4f1; --line2:#c6d5e7;
  --tx:#0e2338; --mut:#5a6e86;
  --acc:#0081C8; --acc2:#0a63a8; --accsoft:#e5f1fb;
  --gold:#d99a1f; --gold2:#b47c12; --good:#1f9d57; --warn:#e23b3b;
  --ring5:linear-gradient(90deg,#0081C8 0%,#00a1e0 22%,#f4c300 46%,#00a651 72%,#ee334e 100%);
  --shadow:0 8px 22px rgba(24,58,105,.10);
  --fz:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{background:linear-gradient(180deg,#eef5fc,#e3ecf7 55%) fixed,var(--bg);color:var(--tx);
  font-family:"Be Vietnam Pro","Noto Sans KR","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;padding:12px 16px;gap:11px;max-width:1920px;margin:0 auto;position:relative}

/* ===== 상단 한 줄 통합 바 ===== */
header{display:flex;align-items:center;gap:13px;flex-wrap:nowrap}
.brand{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex:0 0 auto;min-width:0;overflow:hidden;padding:5px 10px;border-radius:12px}
.flags{display:flex;align-items:center;gap:12px}
.ic{height:46px;width:auto;display:block}
.flag{height:46px;border-radius:5px;box-shadow:0 2px 7px rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.75)}
/* 오륜기~한국기 전체 금색 글로우(아주 느리게) + 좌→우 빛 스윕(아주 느리게) */
.flags .ic{animation:glowpulse 11s ease-in-out infinite}
@keyframes glowpulse{0%,100%{filter:drop-shadow(0 0 2px rgba(217,154,31,.30))}50%{filter:drop-shadow(0 0 13px rgba(240,200,90,.95))}}
.sig-name{font-size:calc(12.5px*var(--fz));font-weight:800;letter-spacing:1.5px;white-space:nowrap;
  background:linear-gradient(90deg,#9a6a10 0%,#d99a1f 30%,#fff6d0 50%,#d99a1f 70%,#9a6a10 100%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:goldmove 12s linear infinite}
@keyframes goldmove{0%{background-position:170% 0}100%{background-position:-170% 0}}
.brand::after{content:"";position:absolute;top:0;bottom:0;left:-55%;width:42%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,244,190,.7),transparent);transform:skewX(-18deg);
  animation:sweep 13s ease-in-out infinite}
@keyframes sweep{0%{left:-55%}55%,100%{left:135%}}

.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1;flex:0 0 auto;position:relative;padding-bottom:calc(23px*var(--fz))}
/* 네온 스플릿플랩 시계 (오륜 그라데이션 + 네온 글로우) */
.nflaps{display:flex;align-items:center;gap:calc(5px*var(--fz))}
.nflaps .u{position:relative;width:calc(40px*var(--fz));height:calc(58px*var(--fz));border-radius:calc(8px*var(--fz));
  background:linear-gradient(#17233a,#0b1322);overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(120,180,255,.14),0 4px 10px rgba(10,30,60,.42),0 0 16px rgba(40,160,255,.18)}
.nflaps .u::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;transform:translateY(-1px);background:rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nflaps .u.flip{animation:nflip .4s ease}
@keyframes nflip{0%{transform:translateY(-9%);filter:brightness(1.6)}100%{transform:translateY(0);filter:brightness(1)}}
.nflaps .u b{font-family:'Oswald','Oswald Fallback',sans-serif;font-weight:700;font-size:calc(46px*var(--fz));line-height:1;
  background:linear-gradient(90deg,#39d0ff,#7ee0ff,#ffd77a,#8affc0,#ff8fb0,#39d0ff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:nflow 9s linear infinite;
  filter:drop-shadow(0 0 3px rgba(57,208,255,.75)) drop-shadow(0 0 9px rgba(25,150,255,.5))}
@keyframes nflow{to{background-position:300% 0}}
.nflaps .colon{font-family:'Oswald','Oswald Fallback',sans-serif;font-weight:700;font-size:calc(34px*var(--fz));color:#7ee0ff;text-shadow:0 0 8px #19b6ff,0 0 16px #0a84d6;padding:0 1px}
.clock .date{display:flex;align-items:center;gap:9px;margin-top:6px;font-size:calc(16px*var(--fz));font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
/* 시계 하단 한 줄: 날짜 · 날씨 · 현재/체감 · 습도 · 미세먼지 (줄바꿈 없음) */
.cstrip{display:flex;align-items:center;gap:11px;position:absolute;right:0;bottom:0;white-space:nowrap;justify-content:flex-end;font-size:calc(16px*var(--fz));font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;pointer-events:none}
.cstrip .cdiv{color:var(--line2)}
.cstrip .wx-loc{color:var(--acc2);font-weight:800}
.cstrip span{display:inline-flex;align-items:center;gap:5px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:calc(13px*var(--fz));color:var(--good);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.6)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}

/* 툴(네비·보기·언어·속도) */
.tools{display:flex;align-items:center;gap:10px;flex:0 0 auto;flex-wrap:nowrap}
.tt{font-size:calc(21px*var(--fz));font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb{border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:9px;padding:8px 13px;font-size:calc(17px*var(--fz));font-weight:800;cursor:pointer;line-height:1}
.tb:hover{border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--mut);font-size:calc(15px*var(--fz));font-weight:800;padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.speed{display:flex;align-items:center;gap:7px}
.speed span{font-size:calc(14px*var(--fz));color:var(--mut);font-weight:800;white-space:nowrap}
.speed input{width:120px;accent-color:var(--acc)}
.clock{cursor:pointer}
.hend{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:12px;justify-content:flex-end}
.wx{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;font-weight:800;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 14px;box-shadow:var(--shadow)}
.wx .wx-row{display:flex;align-items:center;gap:12px}
.wx span{display:inline-flex;align-items:center;gap:5px;font-size:calc(16px*var(--fz));color:var(--tx)}
.wx .wx-loc{color:var(--acc2)}
@media (max-width:1180px){.wx .wx-c{display:none}}
/* 단훈 안내 배너 (국기~시계 사이, 우→좌). VI 입력→KO/EN 자동번역 */
.dt{flex:1 1 0;min-width:0;display:flex;align-items:center;height:62px;overflow:hidden;padding:0 14px}
.dt-view{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.dt-track{display:inline-flex;align-items:center;white-space:nowrap;will-change:transform}
.mq-u{display:inline-flex;align-items:center;white-space:nowrap}
.dt-copy{display:inline-flex;align-items:center}
.dt-e{display:inline-flex;align-items:center;gap:8px;padding:0 24px;font-size:calc(27px*var(--fz));font-weight:800;color:var(--acc2);white-space:nowrap}
.mt-grid{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.mt-chk{display:flex;align-items:flex-start;gap:7px;font-size:calc(13px*var(--fz));font-weight:700;color:var(--tx);cursor:pointer;line-height:1.3}
.mt-chk input{margin-top:2px;flex:0 0 auto}
.mt-chk b{color:var(--acc2);flex:0 0 auto}
.pb-badge{display:inline-block;margin-left:6px;font-size:.72em;font-weight:900;color:#fff;background:linear-gradient(90deg,#e8a81a,#d1194a);padding:1px 8px;border-radius:999px;vertical-align:middle;animation:pbPulse 1.1s ease-in-out infinite}
.pb-row{background:linear-gradient(90deg,rgba(232,168,26,.16),transparent)}
@keyframes pbPulse{0%,100%{box-shadow:0 0 0 rgba(232,168,26,0)}50%{box-shadow:0 0 12px rgba(232,168,26,.8)}}
.wk-wrap{display:flex;flex-direction:column;gap:14px;padding:6px 2px}
.wk-card{display:flex;align-items:center;gap:16px;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px 20px}
.wk-ico{font-size:calc(40px*var(--fz));flex:0 0 auto}
.wk-body{flex:1;min-width:0}
.wk-ttl{font-size:calc(15px*var(--fz));font-weight:800;color:var(--mut);letter-spacing:.02em}
.wk-name{font-size:calc(30px*var(--fz));font-weight:900;color:var(--acc2);line-height:1.1}
.wk-sub{font-size:calc(15px*var(--fz));font-weight:700;color:var(--tx);margin-top:2px}
.wk-up{color:#1f9d57;font-weight:900}
.cmp-list{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0}
.cmp-chip{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fz));font-weight:700;border:1px solid var(--line2);border-radius:999px;padding:3px 6px 3px 10px;background:var(--bg2);color:var(--tx)}
.cmp-chip b{color:var(--acc2);font-variant-numeric:tabular-nums}
.cmp-chip.up{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.cmp-chip.past{opacity:.5}
.cmp-del{border:none;background:transparent;color:var(--mut);cursor:pointer;font-weight:900;font-size:1.05em;line-height:1;padding:0 2px}
.dt-e i{font-style:normal;font-size:1.05em}
.dt-e.k{color:var(--gold2)}
.dt-sep{color:var(--line2);font-size:calc(15px*var(--fz))}
.dt-empty{color:var(--mut);font-weight:700;opacity:.55;font-size:calc(14px*var(--fz));padding:0 10px;white-space:nowrap}
/* 세계 랭킹·기록 하단 가로 전광판 (우→좌, 전체폭). 종목 라벨은 좌측 고정 */
.wr{flex:0 0 auto;width:100%;display:flex;align-items:center;gap:14px;height:56px;overflow:hidden;
  border-top:2px solid var(--line2);padding-top:8px}
.wr-fixed{flex:0 0 auto;display:flex;align-items:center;gap:7px;white-space:nowrap;
  font-size:calc(17px*var(--fz));font-weight:900;color:var(--gold2);
  background:var(--accsoft);border:1px solid var(--line2);border-radius:10px;padding:7px 12px}
.wr-fixed .wr-glb{font-size:calc(18px*var(--fz))}
.wr-fixed small{font-weight:700;color:var(--mut);font-size:calc(11px*var(--fz))}
.wr-mview{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 96%,transparent)}
.wr-mtrack{display:inline-flex;align-items:center;white-space:nowrap;will-change:transform}
.wr-copy{display:inline-flex;align-items:center}
.wr-e{display:inline-flex;align-items:center;gap:7px;padding:0 20px;font-size:calc(18px*var(--fz));font-weight:800;color:var(--acc2);white-space:nowrap}
.wr-e .wr-rk{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:calc(12px*var(--fz));font-weight:900}
.wr-e .wr-rk.g{min-width:auto;height:auto;border-radius:7px;padding:2px 8px;background:linear-gradient(135deg,#d99a1f,#b47c12);font-size:calc(13px*var(--fz))}
.wr-e .wr-rk.m1{background:linear-gradient(135deg,#e8c24a,#b47c12)}
.wr-e .wr-rk.m2{background:linear-gradient(135deg,#cdd3db,#8a97a7)}
.wr-e .wr-rk.m3{background:linear-gradient(135deg,#d99a5a,#9c5a2a)}
.wr-e i{font-style:normal;font-weight:900;color:var(--mut);font-size:.82em}
.wr-e .wr-pt{color:var(--gold2);font-weight:900;font-variant-numeric:tabular-nums}
.wr-e .wr-pt-u{font-size:.68em;opacity:.55;font-weight:700}
.wr-e.wr-rec{color:#9a6a10}
.wr-e.wr-comp{color:#1f6d4a}
.wr-e .wr-ser{font-size:.82em;font-weight:700;color:var(--mut);letter-spacing:.3px}
.wr-sep{color:var(--line2);padding:0 2px;font-size:calc(13px*var(--fz))}
.wr-empty{display:flex;align-items:center;color:var(--mut);font-size:calc(13px*var(--fz));font-weight:700;opacity:.7;padding:0 10px}
.gear{width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--acc2);font-size:24px;cursor:pointer;line-height:1}
.gear:hover{border-color:var(--acc);background:var(--accsoft)}
.hbtns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.gear.sm{width:38px;height:38px;font-size:19px}
/* 설정 패널 */
.panel{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 44px rgba(16,40,80,.30);padding:15px 18px;display:flex;flex-direction:column;gap:12px;min-width:min(620px,94vw);max-height:calc(100vh - 86px);overflow-y:auto;overscroll-behavior:contain}
.pn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pn-lab{font-size:calc(14px*var(--fz));font-weight:800;color:var(--mut);min-width:58px}
.pt-input{flex:1;min-width:220px;border:1px solid var(--line2);border-radius:9px;padding:10px 13px;font-size:calc(17px*var(--fz));font-weight:700;color:var(--tx);background:var(--bg2);outline:none}
.pt-input:focus{border-color:var(--acc)}
.pn-sub{font-size:calc(13px*var(--fz));font-weight:800;color:var(--mut);white-space:nowrap}
.pn-row input[type=range]{accent-color:var(--acc)}

/* LED 전광판 티커 (우→좌 연속) */
.ticker{display:flex;align-items:center;background:#000;border-radius:11px;overflow:hidden;height:52px;box-shadow:inset 0 0 0 1px rgba(255,200,60,.18),0 4px 16px rgba(0,0,0,.35)}
.tk-ico{flex:0 0 auto;padding:0 16px;font-size:28px}
.tk-view{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 0,#000 94%,transparent)}
.tk-track{white-space:nowrap;will-change:transform;padding-left:12px;font-size:calc(27px*var(--fz));font-weight:900;color:#ffcf33;text-shadow:0 0 12px rgba(255,190,40,.7),0 0 2px rgba(255,220,120,.9);letter-spacing:.5px}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-empty{color:rgba(255,210,90,.55);font-weight:800;font-size:calc(26px*var(--fz))}
.tk-input{flex:1;background:#06101c;border:1px solid rgba(255,211,77,.55);color:#ffe79a;font-size:calc(19px*var(--fz));font-weight:700;padding:9px 13px;border-radius:8px;margin:0 9px;outline:none}
.tk-btn{flex:0 0 auto;margin:0 7px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#ffe08a;border-radius:8px;padding:8px 13px;font-size:calc(16px*var(--fz));font-weight:800;cursor:pointer}
.tk-btn:hover{background:rgba(255,255,255,.16)}

/* 달력 */
#cal{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;min-height:0}
.cal-wd{font-size:calc(14px*var(--fz));font-weight:800;color:var(--mut);text-align:center;padding:2px}
.cal-wd.sun{color:#d6336c}.cal-wd.sat{color:#1971c2}
.cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.cal-cell:hover{border-color:var(--acc)}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.cal-dnum{font-size:calc(18px*var(--fz));font-weight:800}
.cal-cell.sun .cal-dnum{color:#d6336c}.cal-cell.sat .cal-dnum{color:#1971c2}
.cal-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-pill{font-size:calc(12px*var(--fz));font-weight:800;color:#fff;border-radius:5px;padding:1px 6px}
.cal-cnt{font-size:calc(13px*var(--fz));color:var(--mut);font-weight:800}

/* 하루 슬라이드 */
#day{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
.slides{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease}
.slide.active{opacity:1;pointer-events:auto}
.card{height:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.slide-h{font-size:calc(17px*var(--fz));font-weight:800;margin-bottom:4px;display:flex;align-items:baseline;gap:9px}
.slide-h .fb{color:var(--gold2);font-weight:800}
.slide-h small{font-size:calc(17px*var(--fz));color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.scroller{flex:1;overflow:hidden;min-height:0}
.routine{font-size:calc(19px*var(--fz));font-weight:800;color:var(--gold2);background:var(--accsoft);border-radius:9px;padding:10px 15px;margin-bottom:12px}
.sched-row{display:grid;grid-template-columns:132px 1fr;gap:13px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:calc(20px*var(--fz))}
.sched-row .t{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.sched-row .ev{font-size:calc(13px*var(--fz));font-weight:800;color:#fff;background:var(--acc);border-radius:5px;padding:1px 8px;margin-right:7px}
.sched-row .shots{font-size:calc(15px*var(--fz));font-weight:800;color:var(--good)}
.sched-row .foc{font-size:calc(16px*var(--fz));color:var(--mut)}
.daygroup{margin-bottom:16px}
.daygroup-h{font-size:calc(14px*var(--fz));font-weight:800;color:var(--acc2);padding:1px 0 2px;border-bottom:1px solid var(--line2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.daygroup-h .sel{color:var(--gold2)}
.tbl{width:100%;border-collapse:collapse;font-size:calc(24px*var(--fz))}
.tbl th{font-size:calc(16px*var(--fz));font-weight:800;color:var(--mut);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th.l,.tbl td.l{text-align:left}
.tbl th.rd{color:#d62828}
.tbl td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.ath{font-weight:800}

function parseCSV(text){
  const rows=[]; let f="",row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }

      else if(c==='\r'){} else f+=c; }
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;

  for(const k in AS){ const days=(AS[k]&&AS[k].days)||[]; const o={};
    days.forEach(x=>{ const dt=x.date,rows=x.rows||[]; if(!dt||!rows.length)return;
      const keep=[]; rows.forEach(r=>{ const t=(r.training||"").trim(); if(!t)return; keep.push({s:r.start||"",e:r.end||"",ev:bi(r.event),tr:bi(t),sh:bi(r.shots),fc:bi(r.focus)}); });
      if(keep.length)o[dt]={routine:bi(x.routine),rows:keep}; });
    disc[k]=o;
  }
  return {disc, order:(plan.eventOrder&&plan.eventOrder.length?plan.eventOrder:Object.keys(disc)), _live:true};
}
async function loadLiveSchedule(){
  try{
    const raw=await fetch(GAS_PLAN,{cache:"no-store"}).then(r=>r.text());
    if(!raw||!raw.startsWith("ENC:"))return false;
    const plan=JSON.parse(decryptData(raw));
    const s=buildSchedFromPlan(plan);
    if(s&&Object.keys(s.disc).length){
      // ★ 통째 교체 금지: 날짜별 병합(GAS 우선, GAS에 없는 날짜는 기존 정적 유지) → 오늘 일정이 사라지지 않음
      SCHED=mergeSched(SCHED, s); return true;
    }
  }catch(e){}
  return false;
}
// 두 일정을 날짜별로 병합: extra(라이브)가 가진 종목/날짜는 extra 우선, 나머지는 base 유지.
function mergeSched(base, extra){
  base=base||{disc:{}}; extra=extra||{disc:{}};
  const disc={}, discs=new Set([...Object.keys(base.disc||{}), ...Object.keys(extra.disc||{})]);
  discs.forEach(dk=>{ disc[dk]=Object.assign({}, (base.disc||{})[dk]||{}, (extra.disc||{})[dk]||{}); });
  const order=(extra.order&&extra.order.length)?extra.order:(base.order||Object.keys(disc));
  return {disc, order, _live: !!(base._live||extra._live)};
}

}

function fitSig(){
  const f=document.querySelector(".flags"), s=document.querySelector(".sig-name");
  if(!f||!s) return;
  const W=f.getBoundingClientRect().width; if(!W) return;
  s.style.whiteSpace="nowrap"; s.style.display="inline-block"; s.style.letterSpacing="0px"; s.style.fontSize="";
  let t=s.scrollWidth; const chars=(s.textContent||"").length;
  if(t>W){ const base=parseFloat(getComputedStyle(s).fontSize)||12.5; s.style.fontSize=(base*W/t).toFixed(2)+"px"; t=s.scrollWidth; }
  const extra=W-s.scrollWidth;
  s.style.letterSpacing=(chars>1 && extra>0)?(extra/(chars-1)).toFixed(2)+"px":"0px";
  s.style.width=W+"px";
}

function paintFlaps(box, digits){
  const want=digits.length;
  if(box._n!==want){
    box._n=want; let di=0; const cells=[];
    for(let i=0;i<want;i++){ if(i>0 && i%2===0) cells.push('<span class="colon">:</span>'); cells.push(`<div class="u"><b>0</b></div>`); di++; }
    box.innerHTML=cells.join("");
  }
  box.querySelectorAll(".u").forEach((u,idx)=>{ const b=u.querySelector("b"), ch=digits[idx];
    if(b.textContent!==ch){ b.textContent=ch; u.classList.remove("flip"); void u.offsetWidth; u.classList.add("flip"); } });
}
function tick(){
  const n=new Date();
  const box=document.getElementById("c-time"), dateEl=document.getElementById("c-date"), clk=document.getElementById("clock");
  if(dateEl) dateEl.textContent=`${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`;   // 하단은 항상 현재 날짜
  if(TIMER.running || TIMER.done){
    let rem = TIMER.done ? 0 : Math.max(0, Math.round((TIMER.end-Date.now())/1000));
    const digits = rem>=3600 ? pad(Math.floor(rem/3600))+pad(Math.floor(rem/60)%60)+pad(rem%60)
                             : pad(Math.floor(rem/60))+pad(rem%60);
    if(box) paintFlaps(box, digits);
    if(clk){ clk.classList.add("timing"); clk.classList.toggle("warn", !TIMER.done && rem<=10); clk.classList.toggle("done", !!TIMER.done); }
    if(!TIMER.done && rem<=0){ TIMER.running=false; TIMER.done=true; TIMER.doneAt=Date.now(); playBell(3); }
    if(TIMER.done && Date.now()-(TIMER.doneAt||0) > 12000) stopTimer();   // 종료 12초 후 시계 복귀
  } else {
    if(clk) clk.classList.remove("timing","warn","done");
    const s=`${pad(n.getHours())}${pad(n.getMinutes())}${pad(n.getSeconds())}`;
    if(box) paintFlaps(box, s);
  }
  checkAlarms(n);
}

let AC=null, REVERB=null, BELL_BUS=null;
function audioCtx(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); }catch(e){} return AC; }

// 합성 임펄스응답(지수감쇠 노이즈) = 성당 잔향
function makeIR(ac,sec,decay){ const rate=ac.sampleRate,len=Math.floor(rate*sec),buf=ac.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
function ensureReverb(ac){ if(BELL_BUS) return;
  REVERB=ac.createConvolver(); REVERB.buffer=makeIR(ac,4.4,2.6);
  BELL_BUS=ac.createGain(); BELL_BUS.gain.value=0.9;
  const dry=ac.createGain(); dry.gain.value=0.7; const wet=ac.createGain(); wet.gain.value=1.05;
  BELL_BUS.connect(dry).connect(ac.destination);
  BELL_BUS.connect(REVERB); REVERB.connect(wet); wet.connect(ac.destination);
}
// 성당 종소리: 비조화 배음 가산합성 + 금속 타격음 + 맥놀이 디튠 + 컨볼루션 잔향(깊은 울림)
function bellStrike(ac,t0,f0,g0){
  ensureReverb(ac);
  const parts=[[0.5,.55,9],[1,1,7],[1.183,.5,4.6],[1.506,.42,4],[2,.78,5.6],[2.514,.3,3.1],[2.662,.26,2.9],[3.011,.4,3.3],[4.166,.2,2.3],[5.433,.15,1.9],[6.796,.1,1.5]];
  const mix=ac.createGain(); mix.gain.value=g0; mix.connect(BELL_BUS);
  parts.forEach(([r,a,dec],i)=>{
    const dets=(i===1||i===4)?[-0.35,0.35]:[0];   // 기음·옥타브 살짝 디튠 → 맥놀이 울림
    dets.forEach(dt=>{ const o=ac.createOscillator(); o.type="sine"; o.frequency.value=f0*r+dt;
      const g=ac.createGain(), a2=a/dets.length;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(a2,t0+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t0+dec);
      o.connect(g).connect(mix); o.start(t0); o.stop(t0+dec+0.15); });
  });
  // 금속성 타격 어택
  const nlen=Math.floor(ac.sampleRate*0.13), nb=ac.createBuffer(1,nlen,ac.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nlen,3);
  const ns=ac.createBufferSource(); ns.buffer=nb;
  const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f0*6; bp.Q.value=0.8;
  const ng=ac.createGain(); ng.gain.value=0.22*g0;
  ns.connect(bp).connect(ng).connect(mix); ns.start(t0); ns.stop(t0+0.15);
}
function playBell(n=3){ const ac=audioCtx(); if(!ac)return; ensureReverb(ac); const t=ac.currentTime+0.06; for(let i=0;i<n;i++) bellStrike(ac,t+i*2.0,165,0.85); }

function checkAlarms(n){

function bindPanel(){

  document.querySelectorAll("#panel .cmp-del").forEach(b=>b.onclick=()=>{ const list=compList().filter(c=>!(c.date===b.dataset.date && (c.name||"")===(b.dataset.name||""))); saveComps(list); renderPanel(); renderDT(); });
  // 🎂 생일 저장
  if(q("bd-save"))q("bd-save").onclick=()=>{ localStorage.setItem("tc_bdays",(q("bd-input").value||"").trim()); renderDT(); const st=q("bd-input"); if(st){ st.style.borderColor="#1f9d57"; setTimeout(()=>st.style.borderColor="",900);} };
  // 🥇 주간 MVP 슬라이드 표시 on/off
  if(q("wk-on"))q("wk-on").onchange=()=>{ localStorage.setItem("tc_weekly_on", q("wk-on").checked?"1":"0"); if(!document.getElementById("day").hidden) buildDay(); };
  // 🎯🏆🏅 문구 카테고리: 끄기/자동/수동 전환 + 수동 체크
  document.querySelectorAll("#panel .seg.pcat button").forEach(b=>b.onclick=()=>{ const cat=b.parentNode.dataset.cat; setCatMode(cat,b.dataset.m); renderPanel(); renderDT(); });
  document.querySelectorAll("#panel .mt-c").forEach(c=>c.onchange=()=>{ const cat=c.dataset.cat; const sel=[]; document.querySelectorAll(`#panel .mt-c[data-cat="${cat}"]`).forEach(x=>{ if(x.checked)sel.push(+x.dataset.i); }); saveCatSel(cat,sel); renderDT(); });
  const ts=q("tk-speed"); if(ts)ts.oninput=()=>{ TK_SPEED=parseFloat(ts.value); localStorage.setItem("tc_tkspeed",TK_SPEED); renderTicker(); };
  const tp=q("tk-pause"); if(tp)tp.oninput=()=>{ TK_PAUSE=parseFloat(tp.value); localStorage.setItem("tc_tkpause",TK_PAUSE); renderTicker(); };
  // 타이머

  if(q("tm-stop"))q("tm-stop").onclick=stopTimer;
  document.querySelectorAll("#panel .tb.q").forEach(b=>b.onclick=()=>{ startTimer(parseInt(b.dataset.m,10)*60); PANEL_OPEN=false; applyPanel(); });
  // 알람(여러 개)
  if(q("al-add"))q("al-add").onclick=()=>{ const v=q("al-time").value; if(!v)return; const tmin=parseInt(q("al-dur").value||"0",10)||0; const tsec=tmin*60;
    const ex=ALARMS.find(a=>a.hhmm===v); if(ex){ ex.tsec=tsec; ex.on=true; } else ALARMS.push({hhmm:v,on:true,tsec}); ALARMS.sort((a,b)=>a.hhmm.localeCompare(b.hhmm)); saveAlarms(); renderPanel(); };
  document.querySelectorAll("#panel .alm-tog").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(ALARMS[i]){ALARMS[i].on=!ALARMS[i].on; saveAlarms(); renderPanel();} });
  document.querySelectorAll("#panel .alm-del").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; ALARMS.splice(i,1); saveAlarms(); renderPanel(); });
  if(q("al-test"))q("al-test").onclick=()=>{ unlockAudio(); playBell(2); };
  // 🌍 세계 랭킹(ISSF 자동) — 종목 선택 + 속도만
  if(q("wr-ev"))q("wr-ev").onchange=()=>{ WR_SEL=q("wr-ev").value; localStorage.setItem("tc_wr_sel",WR_SEL); renderWR(); };
  if(q("wr-spd"))q("wr-spd").oninput=()=>{ WR_SPD=parseFloat(q("wr-spd").value); localStorage.setItem("tc_wr_spd",WR_SPD); renderPanel(); renderWR(); };
  [["wr-s-rank","rank","tc_wr_rank"],["wr-s-rec","rec","tc_wr_rec"],["wr-s-comp","comp","tc_wr_comp"]].forEach(([id,k,ls])=>{ if(q(id))q(id).onchange=()=>{ WR_SHOW[k]=q(id).checked; localStorage.setItem(ls,q(id).checked?"1":"0"); renderWR(); }; });

// ===== 달력 =====
let CY, CM, SEL=null;
function renderCal(){
  document.getElementById("day").hidden=true; document.getElementById("cal").hidden=false;
  renderTicker();
  renderPanel();
  const first=new Date(CY,CM,1), startDow=first.getDay(), dim=new Date(CY,CM+1,0).getDate(), prevDim=new Date(CY,CM,0).getDate();
  const todayIso=iso(new Date());
  const g=document.getElementById("cal-grid"); g.innerHTML="";
  (WD[LANG]||WD.vi).forEach((w,i)=>{const e=document.createElement("div");e.className="cal-wd"+(i===0?" sun":i===6?" sat":"");e.textContent=w;g.appendChild(e);});
  for(let i=0;i<42;i++){
    const dow=i%7; let dy=CY,dm=CM,dd=i-startDow+1,out=false;
    if(dd<1){dm=CM-1;dy=CM===0?CY-1:CY;if(dm<0)dm=11;dd=prevDim+dd;out=true;}
    else if(dd>dim){dm=CM+1;dy=CM===11?CY+1:CY;if(dm>11)dm=0;dd=dd-dim;out=true;}
    const date=`${dy}-${pad(dm+1)}-${pad(dd)}`;
    const ss=sessOn(date);
    const cell=document.createElement("div");
    cell.className="cal-cell"+(out?" out":"")+(date===todayIso?" today":"")+(dow===0?" sun":dow===6?" sat":"");
    const discs=[...new Set(ss.map(x=>x.dk))];
    cell.innerHTML=`<div class="cal-dnum">${dd}</div>`+
      (ss.length?`<div class="cal-cnt">${ss.length}</div>`:"")+
      (discs.length?`<div class="cal-tags">${discs.map(dk=>`<span class="cal-pill" style="background:${DISC_COLOR[dk]||'#888'}">${dk==='air'?'10m':dk==='pistol_50'?'50m':(dk||'·')}</span>`).join("")}</div>`:"");
    cell.onclick=()=>openDay(date);
    g.appendChild(cell);
  }
}

// ===== 하루 슬라이드쇼 =====
let SLIDES=[], CUR=0, slideTimer=null;
function openDay(date){ SEL=date; buildDay(); }
function closeDay(){ clearInterval(slideTimer); renderCal(); }
function shiftDay(delta){ const d=new Date(SEL+"T00:00:00"); d.setDate(d.getDate()+delta); openDay(iso(d)); }
function buildDay(){
  document.getElementById("cal").hidden=true; document.getElementById("day").hidden=false;
  renderPanel();
  renderTicker();
  const half = HALF_SEL==="auto" ? (new Date().getHours()<12?"am":"pm") : HALF_SEL;
  // 당일 일정이 없으면 '같은 요일'의 최신 루틴을 오늘 일정으로 표시(주간 반복 루틴)
  const schedDate = schedHas(SEL) ? SEL : weekdaySchedDate(SEL);
  const schedFallback = schedDate && schedDate!==SEL;
  const effHalf = schedFallback ? "all" : half;   // 요일 매핑은 종일 표시
  SLIDES=[];
  if(VIEW!=="score" && schedDate){
    for(const disc of (SCHED.order||Object.keys(SCHED.disc))){
      if(DISC_SEL!=="all" && disc!==DISC_SEL) continue;
      const sc=SCHED.disc[disc] && SCHED.disc[disc][schedDate]; if(!sc) continue;
      const rows=(sc.rows||[]).filter(r=>{ if(effHalf==="all")return true; const h=parseInt((r.s||"").slice(0,2)); if(isNaN(h))return true; return effHalf==="am"?h<12:h>=12; });
      if(!rows.length) continue;
      SLIDES.push({type:"sched",disc,routine:sc.routine,rows,half:effHalf,schedDate,fallback:schedFallback});
    }
  }
  // ★ 안전장치: 필터(종목/시간대)로 다 걸러졌지만 오늘 실제 행이 있으면 전체(전종목·종일)로라도 표시 → '데이터 있는데 없음' 방지
  if(VIEW!=="score" && schedDate && !SLIDES.some(s=>s.type==="sched")){
    for(const disc of (SCHED.order||Object.keys(SCHED.disc))){
      const sc=SCHED.disc[disc] && SCHED.disc[disc][schedDate]; if(!sc) continue;
      const rows=(sc.rows||[]); if(!rows.length) continue;
      SLIDES.push({type:"sched",disc,routine:sc.routine,rows,half:"all",schedDate,fallback:schedFallback});
    }
  }
  if(VIEW!=="score" && !SLIDES.some(s=>s.type==="sched")) SLIDES.push({type:"noplan"});   // 전체 일정 데이터 없음
  if(VIEW!=="sched") SLIDES.push({type:"scores"});
  if(VIEW!=="sched" && localStorage.getItem("tc_weekly_on")!=="0"){ const wk=weeklyHighlights(); if(wk && (wk.mvp||wk.improved)) SLIDES.push({type:"weekly",wk}); }   // 🥇 주간 하이라이트(설정에서 on/off)
  if(!SLIDES.length) SLIDES.push({type:"scores"});
  renderSlides(); showSlide(0); restartTimer();
}
function slideHTML(s){
  if(s.type==="noplan"){
    // 진단: 왜 '없음'인지 즉시 판별 가능하도록(날짜수 · 오늘 데이터 · SW제어 여부). 데이터 정상 로드 시엔 이 슬라이드 자체가 안 뜸.
    let nDates=0, hasToday=false, rowStr=""; try{ for(const dk in (SCHED.disc||{})){ const m=SCHED.disc[dk]; for(const dt in m){ nDates++; if(dt===SEL)hasToday=true; } const sc=SCHED.disc[dk][SEL]; rowStr+=` ${dk}:${sc?(sc.rows||[]).length:"–"}`; } }catch(e){}
    const src=(SCHED&&SCHED._live)?"GAS":"정적";
    const diag=`${nDates}일·오늘 ${hasToday?"있음":"없음"}·행${rowStr}·${src}·보기 ${VIEW}·종목 ${DISC_SEL}·SW ${window.__SW_CTRL?"제어중⚠":"없음"}·${esc(BUILD)}`;
    return `<div class="card"><div class="slide-h">📋 ${esc(L().plan)} <small class="fb">${esc(vnDate(SEL))}</small></div><div class="scroller"><div class="nodata"><div style="font-size:1.5em;font-weight:900;color:var(--acc2);margin-bottom:8px">📅 ${esc(vnDate(SEL))}</div>${esc(L().noPlan)}<div style="margin-top:14px;font-size:.62em;color:var(--mut);opacity:.75">${diag}</div></div></div></div>`;
  }
  if(s.type==="scores"){
    // 훈련 기록이 '있는 날' 기준 최근 3일(쉬는 날은 건너뜀 — 예: 일요일 쉬면 토·금·목)
    const days=[...new Set((SESSIONS||[]).map(x=>x.date))].filter(d=>d&&d<=SEL).sort().reverse().slice(0,3);
    // 🏆 개인 최고기록(PB, 60발환산): 선수별 역대 최고 → 그 기록이 표에 뜨면 축하 강조
    const PB={}; (SESSIONS||[]).forEach(x=>{ const c=conv60(x); if(!(x.name in PB)||c>PB[x.name])PB[x.name]=c; });
    let body="",any=false;
    for(const dt of days){ const ss=sessOn(dt).slice().sort((a,b)=>conv60(b)-conv60(a)); if(!ss.length)continue; any=true;
      body+=`<div class="daygroup"><div class="daygroup-h">${vnShort(dt)}${dt===SEL?' <span class="sel">●</span>':''}</div>`+
        `<table class="tbl"><thead><tr><th class="l">${esc(L().ath)}</th><th>${esc(L().disc)}</th><th class="l">${esc(L().series)}</th><th>${esc(L().total)}</th><th>10</th><th>9</th><th class="rd">8</th><th class="rd">7</th><th class="rd">6↓</th><th>${esc(L().streak)}</th></tr></thead><tbody>`+
        ss.map(x=>{const d=x.dist||[];const hd=d.length>0;const d6=hd?d.slice(4,11).reduce((s,v)=>s+(v||0),0):null;
          const serHTML=x.series.length?x.series.map(v=>{let c="";if(v>=99)c="s-blink";else if(v>=96)c="s-good";else if(v<=94)c="s-bad";return `<span class="sv ${c}">${v}</span>`;}).join(""):"—";
          const lngHTML=x.long10!=null?`<span class="${x.long10>=10?'blink10':''}">${x.long10}</span>`:"—";
          const isPB = PB[x.name]!=null && conv60(x)>=PB[x.name]-0.049;
          return `<tr class="${isPB?'pb-row':''}"><td class="l ath">${esc(x.name)}${isPB?' <span class="pb-badge">🏆PB</span>':''}</td><td><span class="disc" style="background:${DISC_COLOR[x.dk]||'#888'}">${esc(discLabel(x))}</span></td><td class="l series${x.series.length>=8?' many':''}">${serHTML}</td><td class="total">${fmt(x.total)}<span class="tot-raw">${esc(L().conv60)} ${fmt(conv60(x))}</span></td><td class="d10">${d[0]!=null?d[0]:"—"}</td><td>${d[1]!=null?d[1]:"—"}</td><td class="dlow">${d[2]!=null?d[2]:"—"}</td><td class="dlow">${d[3]?d[3]:(hd?"":"—")}</td><td class="dlow">${d6?d6:(hd?"":"—")}</td><td class="lng">${lngHTML}</td></tr>`;}).join("")+
        `</tbody></table></div>`;
    }
    const hdRange = days.length ? (days.length>1?`${vnShort(days[days.length-1])}~${vnShort(days[0])}`:vnShort(days[0])) : "";
    return `<div class="card"><div class="slide-h">📊 ${esc(L().scores)} <small>${hdRange}</small></div><div class="scroller">${any?body:`<div class="nodata">${esc(L().noRec)}</div>`}</div></div>`;
  }
  if(s.type==="weekly"){
    const wk=s.wk, f=v=>fmt(Math.round(v*10)/10); let b="";
    if(wk.mvp) b+=`<div class="wk-card"><div class="wk-ico">🥇</div><div class="wk-body"><div class="wk-ttl">${esc(L().mvpLab)}</div><div class="wk-name">${esc(wk.mvp.name)}</div><div class="wk-sub">${esc(L().conv60)} ${f(wk.mvp.avg)} · ${wk.mvp.n}${esc(L().sessUnit)}</div></div></div>`;
    if(wk.improved) b+=`<div class="wk-card"><div class="wk-ico">📈</div><div class="wk-body"><div class="wk-ttl">${esc(L().impLab)}</div><div class="wk-name">${esc(wk.improved.name)}</div><div class="wk-sub"><span class="wk-up">▲ ${f(wk.improved.gain)}</span> · ${esc(L().conv60)} ${f(wk.improved.avg)}</div></div></div>`;
    return `<div class="card"><div class="slide-h">🥇 ${esc(L().weekLab)}</div><div class="scroller"><div class="wk-wrap">${b||`<div class="nodata">${esc(L().noRec)}</div>`}</div></div></div>`;
  }
  const half=s.half==="all"?L().allDay:(s.half==="am"?L().am:L().pm);
  const rows=s.rows.map(r=>`<div class="sched-row"><span class="t">${esc(r.s)}${r.e&&r.e!==r.s?"~"+esc(r.e):""}</span><span>${pick(r.ev)?`<span class="ev">${esc(pick(r.ev))}</span>`:""}${esc(pick(r.tr))}${pick(r.sh)?` <span class="shots">${esc(pick(r.sh))}</span>`:""}${pick(r.fc)?`<span class="foc"> · ${esc(pick(r.fc))}</span>`:""}</span></div>`).join("");
  const fb=s.fallback?` <small class="fb">${esc((WD[LANG]||WD.vi)[new Date(SEL+"T00:00:00").getDay()])} ${esc(L().plan)}</small>`:"";
  return `<div class="card"><div class="slide-h">📋 ${esc(s.disc)} · ${esc(L().plan)} <small>(${esc(half)})</small>${fb}</div><div class="scroller">${rows}</div></div>`;
}
function renderSlides(){
  const box=document.getElementById("slides");
  box.innerHTML=SLIDES.map(s=>`<div class="slide">${slideHTML(s)}</div>`).join("");
  const dots=document.getElementById("dots");
  dots.innerHTML=SLIDES.map((_,i)=>`<div class="dot2" data-i="${i}"></div>`).join("");
  dots.querySelectorAll(".dot2").forEach(d=>d.onclick=()=>{ showSlide(+d.dataset.i); restartTimer(); });
}
function showSlide(i){
  CUR=(i%SLIDES.length+SLIDES.length)%SLIDES.length;
  const box=document.getElementById("slides");
  [...box.children].forEach((el,k)=>el.classList.toggle("active",k===CUR));
  document.querySelectorAll("#dots .dot2").forEach((d,k)=>d.classList.toggle("on",k===CUR));
  SST={pos:0};
  const el=activeScroller(); if(el)el.scrollTop=0;
}
// 끊김없는 세로 순환: 내용이 넘치면 같은 내용을 한 벌 더 복제해 이어붙임(가로 전광판과 동일 원리).
// → 맨 아래에서 멈췄다 되돌아가지 않고, 복제본으로 자연스럽게 이어져 계속 흐름.
function setupScroll(el){
  if(!el || el.dataset.scInit==="1") return;
  el.dataset.scInit="1";
  const copyH=el.scrollHeight;                 // 1벌 콘텐츠 높이
  if(copyH - el.clientHeight <= 4){ el._dup=false; el._copyH=0; return; }   // 안 넘치면 스크롤 불필요
  el._dup=true; el._copyH=copyH;
  el.insertAdjacentHTML("beforeend", el.innerHTML);   // 같은 내용 한 벌 더 → 끊김없이 순환
}
// 스크롤 속도는 설정값(SPEED) 그대로 — 가속 없음(느리게 하면 실제로 느려짐).
// frames=한 바퀴에 걸리는 프레임(=loop/SPEED). dwellFrames=체류 상한(PASS_CAP) 적용.
function scrollPass(el){
  if(!el||SPEED<=0) return {loop:0,frames:0,speed:(SPEED>0?SPEED:0.2),dup:false};
  setupScroll(el);
  if(!el._dup) return {loop:0,frames:0,speed:SPEED,dup:false};
  const loop=el._copyH, capFrames=PASS_CAP_MS/1000*60;
  const frames=loop/SPEED;
  return {loop, frames, dwellFrames:Math.min(frames,capFrames), speed:SPEED, dup:true};
}
// 슬라이드 체류시간: 한 바퀴 다 보일 시간 머문 뒤 다음 슬라이드로(짧으면 기본 15초, 너무 길면 4분 상한).
function slideDwellMs(){
  const p=scrollPass(activeScroller());
  if(!p.dup || p.frames<=0) return SLIDE_MS;
  const ms=(p.dwellFrames!=null?p.dwellFrames:p.frames)/60*1000 + 1500;
  return Math.max(SLIDE_MS, Math.round(ms));
}
function restartTimer(){ clearTimeout(slideTimer); if(SLIDES.length>1) slideTimer=setTimeout(()=>{ showSlide(CUR+1); restartTimer(); }, slideDwellMs()); }
const fmt = v => Number.isInteger(v)?v:(Math.round(v*10)/10);
// 60발 환산 평균: 세션 발수(시리즈수×10)가 달라도 공정 비교. 발수 모르면 총점 그대로.
function conv60(x){ const shots=(x.series&&x.series.length)?x.series.length*10:0; return shots>0?Math.round(x.total/shots*60*10)/10:x.total; }
// 🥇 주간 하이라이트: 최근 7일 MVP(평균 60발환산 1위) + 최다 향상(지난 7일 대비 상승 1위)
function weeklyHighlights(){
  const base=new Date(((typeof SEL!=="undefined"&&SEL)?SEL:iso(new Date()))+"T00:00:00");
  const d0=new Date(base); d0.setDate(d0.getDate()-6);
  const p1=new Date(base); p1.setDate(p1.getDate()-13); const p2=new Date(base); p2.setDate(p2.getDate()-7);
  const inR=(ds,lo,hi)=>{ const t=new Date(ds+"T00:00:00"); return t>=lo&&t<=hi; };
  const cur={}, pre={};
  (SESSIONS||[]).forEach(x=>{ const c=conv60(x);
    if(inR(x.date,d0,base)){ (cur[x.name]=cur[x.name]||{s:0,n:0}); cur[x.name].s+=c; cur[x.name].n++; }
    else if(inR(x.date,p1,p2)){ (pre[x.name]=pre[x.name]||{s:0,n:0}); pre[x.name].s+=c; pre[x.name].n++; } });
  const rows=Object.keys(cur).map(n=>({name:n, avg:cur[n].s/cur[n].n, n:cur[n].n, prev:pre[n]?pre[n].s/pre[n].n:null}));
  if(!rows.length) return null;
  const mvp=rows.slice().sort((a,b)=>b.avg-a.avg)[0];
  const impRows=rows.filter(r=>r.prev!=null).map(r=>({...r,gain:r.avg-r.prev})).filter(r=>r.gain>0);
  const improved=impRows.length?impRows.sort((a,b)=>b.gain-a.gain)[0]:null;
  return {mvp,improved};
}
// 🎂 오늘 생일인 선수들(설정: "이름:MM-DD, 이름:MM-DD")
function bdaysToday(){
  const raw=localStorage.getItem("tc_bdays")||""; if(!raw.trim())return [];
  const now=(typeof SEL!=="undefined"&&SEL)?SEL:iso(new Date()); const md=now.slice(5);   // MM-DD
  const out=[];
  raw.split(/[,\n]/).forEach(p=>{ const m=p.split(":"); if(m.length<2)return; const nm=m[0].trim(); const dd=m[1].trim().replace(/\//g,"-").replace(/\./g,"-");
    const mm=dd.match(/(\d{1,2})-(\d{1,2})/); if(nm&&mm){ const key=pad(+mm[1])+"-"+pad(+mm[2]); if(key===md)out.push(nm); } });
  return out;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 공용 가로 전광판: inner(한 벌)을 뷰포트 채울 만큼 반복 후 2배 → 여백 없이 끝→처음 끊김없는 무한 루프
function fillMarquee(view, track, inner, kfId, kfName, speed){
  if(!view||!track) return;
  track.style.animation="none";
  const unit=`<span class="mq-u">${inner}</span>`;
  track.innerHTML=unit;
  const uw=track.firstChild?track.firstChild.getBoundingClientRect().width:0;
  const vw=view.getBoundingClientRect().width||0;
  if(uw<=1){ track.style.animation="none"; return; }
  const k=Math.max(1, Math.ceil(vw/uw)+1);   // 뷰포트를 채우는 반복수
  track.innerHTML=unit.repeat(k*2);           // 2배 → 이음새 없는 루프
  const blockW=uw*k;
  let kf=document.getElementById(kfId); if(!kf){ kf=document.createElement("style"); kf.id=kfId; document.head.appendChild(kf); }
  kf.textContent=`@keyframes ${kfName}{from{transform:translateX(0)}to{transform:translateX(-${blockW}px)}}`;
  void track.offsetWidth;
  track.style.animation=`${kfName} ${(blockW/Math.max(10,speed)).toFixed(2)}s linear infinite`;
}
// LED 전광판 티커: 수동 입력(localStorage) 우선, 없으면 당일 routine. 우→좌 연속 스크롤.
let TK_SPEED=parseFloat(localStorage.getItem("tc_tkspeed")||"60");   // px/초 (조절 가능)
let TK_PAUSE=parseFloat(localStorage.getItem("tc_tkpause")||"3");    // 시작 멈춤(초, 조절 가능)
function tickerText(){
  const manual=(localStorage.getItem("tc_ticker")||"").trim();
  if(manual) return manual;
  return document.getElementById("day").hidden ? "" : routineOf(SEL);
}
function renderTicker(){
  const view=document.getElementById("tk-view"), track=document.getElementById("tk-track");
  if(!view||!track) return;
  const text=tickerText();
  track.style.animation="none";
  if(!text){ track.innerHTML=`<span class="tk-empty">${esc(L().tkPH)}</span>`; return; }
  const seg=esc(text)+"    •    ";
  const inner=`${esc(text)}<span class="tk-gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
  fillMarquee(view, track, inner, "tk-kf", "tkrun", TK_SPEED);
}
// (티커 편집은 설정 패널의 pt-input/pt-save에서 처리)

// 활성 슬라이드 자동스크롤 (복제본으로 끊김없이 연속 순환)
let SST={pos:0};
function activeScroller(){ return document.querySelector(".slide.active .scroller"); }
function animScroll(){
  requestAnimationFrame(animScroll);
  if(SPEED<=0||document.getElementById("day").hidden) return;
  const el=activeScroller(); if(!el) return;
  const p=scrollPass(el);
  if(!p.dup){ el.scrollTop=0; return; }   // 안 넘치면 고정
  SST.pos+=p.speed;
  if(SST.pos>=p.loop) SST.pos-=p.loop;    // 끝→처음 끊김없이 연속(복제본으로 이어져 멈춤 없음)
  el.scrollTop=SST.pos;
}
animScroll();

function setLang(l){ LANG=l; localStorage.setItem("tc_lang",l); document.documentElement.lang=(l==="ko"?"ko":l==="en"?"en":"vi"); renderWeather(); renderWR(); renderDT(); if(document.getElementById("day").hidden) renderCal(); else { const k=CUR; buildDay(); showSlide(Math.min(k,SLIDES.length-1)); } }
function setView(v){ VIEW=v; localStorage.setItem("tc_view",v); if(!document.getElementById("day").hidden) buildDay(); }
function setDisc(d){ DISC_SEL=d; localStorage.setItem("tc_disc",d); if(!document.getElementById("day").hidden) buildDay(); }
function setHalf(h){ HALF_SEL=h; localStorage.setItem("tc_half",h); if(!document.getElementById("day").hidden) buildDay(); renderPanel(); }

function rerenderKeep(){ if(document.getElementById("day").hidden) renderCal(); else { const k=CUR; buildDay(); showSlide(Math.min(k,SLIDES.length-1)); } }
async function boot(){
  const n=new Date(); CY=n.getFullYear(); CM=n.getMonth();
  const _clk=document.getElementById("clock");
  _clk.onclick=toggleTimer;   // 시계 숫자 탭 = 타이머 시작/정지
  _clk.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleTimer(); } };
  document.getElementById("gear").onclick=togglePanel;    // ⚙ = 설정(타이머 시간·알람 등)
  const _calb=document.getElementById("cal-btn"); if(_calb)_calb.onclick=()=>{ clearInterval(slideTimer); renderCal(); };   // 📅 = 달력
  document.addEventListener("click",e=>{ if(!PANEL_OPEN)return; const p=document.getElementById("panel"); if(p && !p.contains(e.target) && !e.target.closest("#clock,#gear")){ PANEL_OPEN=false; applyPanel(); } });
  try{ await loadData(); }catch(e){ document.getElementById("cal-grid").innerHTML=`<div class="err" style="grid-column:1/-1">${esc(e.message)}</div>`; }
  await loadStatic();   // 즉시 기준(정적) — 라이브는 느리므로 먼저 표시
  const td=iso(new Date());
  if(sessOn(td).length || schedHas(td)) openDay(td); else renderCal();
  loadLiveSchedule().then(ok=>{ if(ok) rerenderKeep(); });   // 라이브 일정(느림) 도착 시 교체
  loadWeather();   // 현재 사격장 위치 + 실시간 날씨
  loadWorldRank(); // 세계 랭킹(ISSF worldrank.json) 자동 로드 + 롤러
  renderDT();      // 단훈 안내 배너
  fitSig();        // 서명 폭 맞춤
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSig);
}
boot();
