name: Build & Deploy (권총기록 아카이브)

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다: 시트 읽어 배포 (최선노력, 다소 지연 가능)
    - cron: '15 19 * * *'    # 매일 1회(UTC 19:15 ≈ 한국 04:15): 압축 아카이브 커밋
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write        # 아카이브 스냅샷 커밋용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # 1) 구글시트에서 최신 데이터 → 권총 JSON (build/*.json). 외부 의존성 없음.
      - name: ETL (fetch live sheet)
        run: node etl.js --fetch

      # 2) 배포 산출물 조립: web/ 를 루트로, build/ 를 그 아래로
      - name: Assemble site
        run: |
          rm -rf dist && mkdir -p dist/build
          cp -r web/* dist/
          cp build/*.json dist/build/

      # 3) (하루 1회) 압축 스냅샷 커밋 → git 이력이 곧 아카이브(원본 삭제 대비)
      - name: Daily archive snapshot
        if: github.event.schedule == '15 19 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          mkdir -p snapshots
          tar -czf snapshots/latest.tar.gz -C build .
          cp build/meta.json snapshots/latest-meta.json
          git add snapshots
          git commit -m "archive snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "push skipped"

      # 4) GitHub Pages 배포
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
